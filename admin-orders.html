<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>VN SHOP · ADMIN ORDERS</title><style>*{box-sizing:border-box}body{margin:0;background:#eeeae2;color:#171411;font:14px/1.55 Inter,Arial,sans-serif}main{width:min(1120px,calc(100% - 36px));margin:48px auto}header,.bar,.foot{display:flex;justify-content:space-between;align-items:center;gap:16px}header{align-items:end;margin-bottom:28px}.eyebrow,.label{font-size:10px;letter-spacing:.16em;font-weight:800;color:#756f65}h1{font-size:clamp(34px,5vw,54px);letter-spacing:-.07em;margin:8px 0}header p{max-width:390px;color:#756f65;font-size:12px}.panel,.order{background:#fffdf8;border:1px solid #d9d2c6;padding:20px;margin-bottom:14px}button,a{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 15px;border:1px solid #171411;background:#171411;color:white;text-decoration:none;font-size:10px;font-weight:800;letter-spacing:.1em;cursor:pointer}button.secondary,a.secondary{background:transparent;color:#171411}.status,.meta{font-size:12px;color:#756f65}.status.error{color:#a12e2e}.order-head{display:flex;justify-content:space-between;border-bottom:1px solid #d9d2c6;padding-bottom:12px}.order-number{font-size:17px;font-weight:800}.tag{border:1px solid #d9d2c6;padding:6px 9px;font-size:9px;font-weight:800;letter-spacing:.12em}.body{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:18px;padding:16px 0}.label{display:block;margin-bottom:6px}.item{font-size:12px;margin:6px 0}.item small{display:block;color:#756f65}.value{font-size:12px;overflow-wrap:anywhere}.foot{border-top:1px solid #d9d2c6;padding-top:12px}.empty{padding:45px;text-align:center;border:1px dashed #d9d2c6;color:#756f65}@media(max-width:680px){main{margin:28px auto}header{display:block}.body{grid-template-columns:1fr 1fr}.body>div:first-child{grid-column:1/-1}.foot{align-items:flex-start;flex-direction:column}}</style></head><body><main><header><div><div class="eyebrow">VN SHOP® · PRIVATE OPERATIONS</div><h1>ADMIN ORDERS</h1></div><p>Admin orders are registered here only after delivery is recorded. Returns update the same separate record.</p></header><section class="panel"><div class="bar"><div><div class="eyebrow">SEPARATE ADMIN REGISTER</div><strong id="count">—</strong></div><button id="refresh" class="secondary">REFRESH</button></div><p id="status" class="status">Verifying administrator access…</p></section><section id="orders"></section><div class="bar"><a class="secondary" href="inventory-admin.html">INVENTORY</a><a href="merch.html">RETURN TO SHOP</a></div></main><script>
(()=>{const API="https://vn-shop-account-api.9ojeez9.workers.dev",sn=document.getElementById("status"),root=document.getElementById("orders"),count=document.getElementById("count"),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));async function api(path,opts={}){const t=sessionStorage.getItem("vn_account_session")||"";if(!t)throw Error("Admin session missing. Sign in through VN SHOP first.");const r=await fetch(API+path,{...opts,headers:{Authorization:"Bearer "+t,"Content-Type":"application/json",...(opts.headers||{})}}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||d.message||"Request failed ("+r.status+")");return d}function norm(r){let o={};try{o=typeof r.order_json==="string"?JSON.parse(r.order_json):r.order_json||{}}catch{}let c=r.customer||o.customer||{};try{if(r.customer_json)c=JSON.parse(r.customer_json)}catch{}let it=Array.isArray(r.items)?r.items:[];if(!it.length){try{it=JSON.parse(r.items_json||"[]")}catch{it=o.items||[]}}return{...o,...r,customer:c,items:it,number:r.order_number||r.orderNumber||o.orderNumber||o.order_number||r.id,status:String(r.status||o.status||"delivered").toLowerCase()}}function render(rows){rows=rows.map(norm).filter(r=>["delivered","returned"].includes(r.status));count.textContent=rows.length+" RECORD"+(rows.length===1?"":"S");if(!rows.length){root.innerHTML='<div class="empty">No delivered or returned admin orders have been recorded.</div>';return}root.innerHTML=rows.map(r=>{const c=r.customer||{},items=(r.items||[]).map(i=>{const p=i.product||i;return '<div class="item"><strong>'+esc(p.title||p.name||i.title||i.name||"Product")+'</strong><small>QTY '+esc(i.quantity||i.qty||1)+'</small></div>'}).join("");return '<article class="order"><div class="order-head"><div><strong class="order-number">'+esc(r.number)+'</strong><div class="meta">'+esc(r.created_at||r.createdAt||"")+'</div></div><span class="tag">'+(r.status==="returned"?"RETURNED":"DELIVERED")+'</span></div><div class="body"><div><span class="label">ITEMS</span>'+(items||"—")+'</div><div><span class="label">ADMIN DETAILS</span><div class="value">'+esc(c.firstName||c.first_name||"")+' '+esc(c.lastName||c.last_name||"")+'</div><div class="meta">'+esc(c.email||"")+'</div></div><div><span class="label">TOTAL / ADDRESS</span><div class="value">'+esc(r.total??"—")+' '+esc(r.currency||"TRY")+'</div><div class="meta">'+esc(c.address||"")+'</div></div></div><div class="foot"><span class="meta">SEPARATE FROM CUSTOMER ORDERS AND STOCK</span>'+(r.status==="delivered"?'<button class="secondary" data-return="'+esc(r.id)+'">MARK RETURNED</button>':'<span class="meta">RETURN RECORDED</span>')+'</div></article>'}).join("")}async function load(){const b=document.getElementById("refresh");b.disabled=true;try{const a=await api("/api/account");if(a.is_admin!==true&&a.isAdmin!==true)throw Error("Administrator access is required.");const d=await api("/api/admin-orders");render(d.orders||d.admin_orders||[]);sn.textContent="Admin order register updated.";sn.classList.remove("error")}catch(e){root.innerHTML="";count.textContent="—";sn.textContent=e.message;sn.classList.add("error")}finally{b.disabled=false}}root.addEventListener("click",async e=>{const b=e.target.closest("[data-return]");if(!b)return;b.disabled=true;try{await api("/api/admin-orders/"+encodeURIComponent(b.dataset.return),{method:"PATCH",body:JSON.stringify({status:"returned"})});await load()}catch(err){b.disabled=false;sn.textContent=err.message;sn.classList.add("error")}});document.getElementById("refresh").addEventListener("click",load);load()})();
</script></body></html>
