<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>VN SHOP® — ORDER MANAGEMENT</title>
<style>
:root{color-scheme:light;--ink:#111;--paper:#e4e3e1;--line:#c7c6c3;--muted:#666;--panel:#f7f7f5;--accent:#e4cea5}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 Arial,Helvetica,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.shell{max-width:1600px;margin:auto;padding:30px clamp(16px,3vw,48px) 60px}.top{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;border-bottom:1px solid var(--ink);padding-bottom:22px}.eyebrow{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}h1{font-size:clamp(25px,4vw,42px);letter-spacing:-.055em;line-height:1.05;margin:7px 0 0;font-weight:800}.session{display:flex;align-items:center;gap:14px;color:var(--muted);font-size:12px}.plain{border:1px solid var(--ink);background:transparent;padding:9px 13px;font-size:11px;letter-spacing:.08em;text-transform:uppercase}.plain:hover{background:var(--ink);color:white}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:22px 0}.stat{background:var(--panel);border:1px solid var(--line);padding:16px 18px}.stat span{display:block;color:var(--muted);font-size:10px;letter-spacing:.13em;text-transform:uppercase}.stat strong{display:block;font-size:27px;letter-spacing:-.04em;margin-top:4px}.tabs{display:flex;gap:4px;border-bottom:1px solid var(--ink);margin:28px 0 18px;overflow:auto}.tab{border:0;background:transparent;padding:13px 18px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap;border-bottom:2px solid transparent}.tab[aria-selected=true]{color:var(--ink);border-color:var(--ink);font-weight:700}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.toolbar input{width:min(360px,100%);background:var(--panel);border:1px solid var(--line);padding:11px 13px;outline:none}.toolbar select{background:var(--panel);border:1px solid var(--line);padding:11px 13px}.list{display:grid;gap:10px}.order{background:var(--panel);border:1px solid var(--line);padding:18px;display:grid;grid-template-columns:minmax(180px,1.2fr) minmax(160px,1fr) minmax(150px,.8fr) minmax(220px,1fr);gap:18px;align-items:center}.order h2{font-size:16px;margin:0 0 4px}.meta{font-size:12px;color:var(--muted);overflow-wrap:anywhere}.items{font-size:12px;margin-top:8px}.status{display:inline-flex;border:1px solid var(--line);padding:4px 8px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;background:white}.status[data-status=delivered],.status[data-status=returned]{border-color:#6f8875}.actions{display:flex;flex-wrap:wrap;gap:7px;justify-content:flex-end}.actions select{min-width:145px;max-width:100%;padding:9px;border:1px solid var(--line);background:white}.actions button{padding:9px 11px;border:1px solid var(--ink);background:var(--ink);color:white;font-size:10px;letter-spacing:.07em;text-transform:uppercase}.actions button.secondary{background:transparent;color:var(--ink)}.empty,.notice{background:var(--panel);border:1px solid var(--line);padding:24px;color:var(--muted)}.notice.error{color:#8b2020;border-color:#c88}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:18px;z-index:10}.dialog{width:min(560px,100%);max-height:85vh;overflow:auto;background:var(--panel);padding:24px;border:1px solid var(--ink)}.dialog h2{margin:0 0 18px;font-size:20px}.field{display:grid;gap:6px;margin:14px 0}.field label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}.field select,.field textarea{width:100%;padding:11px;border:1px solid var(--line);background:white}.field textarea{min-height:90px;resize:vertical}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.login{min-height:70vh;display:grid;place-items:center;text-align:center}.login section{max-width:440px;background:var(--panel);border:1px solid var(--line);padding:34px}.login h2{margin:0 0 8px}.login p{color:var(--muted)}.spinner{padding:48px;text-align:center;color:var(--muted)}@media(max-width:900px){.order{grid-template-columns:1fr 1fr}.actions{justify-content:flex-start}}@media(max-width:560px){.shell{padding:18px 12px 40px}.top{align-items:flex-start;flex-direction:column}.stats{grid-template-columns:1fr 1fr}.order{grid-template-columns:1fr;gap:12px}.toolbar{align-items:stretch;flex-direction:column}.toolbar input{width:100%}.session{width:100%;justify-content:space-between}}
</style>
<script defer crossorigin="anonymous" data-clerk-publishable-key="pk_test_aHVtYmxlLW94LTcwNTUuY2xlcmsuYWNjb3VudHMuZGV2JA" src="https://humble-ox-7055.clerk.accounts.dev/npm/@clerk/clerk-js@6.39.0/dist/clerk.browser.js"></script>
</head>
<body>
<main class="shell">
<header class="top"><div><div class="eyebrow">VN SHOP® / OPERATIONS</div><h1>ORDER MANAGEMENT</h1></div><div class="session"><span id="operator">Verifying access…</span><button class="plain" id="signout" type="button">Sign out</button></div></header>
<section id="app" class="hidden">
<div class="stats"><div class="stat"><span>Active orders</span><strong id="stat-active">—</strong></div><div class="stat"><span>Preparing</span><strong id="stat-preparing">—</strong></div><div class="stat"><span>Delivering</span><strong id="stat-delivering">—</strong></div><div class="stat"><span>Open requests</span><strong id="stat-requests">—</strong></div></div>
<nav class="tabs" aria-label="Order management sections">
<button class="tab" data-tab="orders" aria-selected="true">Orders</button><button class="tab" data-tab="returns" aria-selected="false">Returns</button><button class="tab" data-tab="issues" aria-selected="false">Customer reports</button>
</nav>
<div class="toolbar"><input id="search" type="search" placeholder="Search order, VN code, customer…" autocomplete="off"><select id="filter"><option value="all">All statuses</option></select></div>
<div id="message" class="notice hidden" role="status"></div><div id="list" class="list"><div class="spinner">Loading records…</div></div>
</section>
<section id="gate" class="login"><section><h2>Secure access required</h2><p id="gate-message">Sign in with an authorized VN SHOP account to access order management.</p><a class="plain" href="merch.html#account">Open account sign-in</a></section></section>
</main>
<div id="modal" class="modal hidden" role="dialog" aria-modal="true"><section class="dialog"><h2 id="modal-title">Update record</h2><div id="modal-body"></div><div class="dialog-actions"><button class="plain" id="modal-cancel" type="button">Cancel</button><button class="plain" id="modal-save" type="button">Save changes</button></div></section></div>
<script>
(()=>{"use strict";
const API="https://vn-shop-account-api.9ojeez9.workers.dev";
const $=id=>document.getElementById(id);
const state={token:"",tab:"orders",orders:[],returns:[],issues:[],filter:"all",query:"",pending:null};
const cancelReasons=["High workload","Out of stock","Suspicious purchase","Address or delivery information issue","Product unavailable","Payment could not be verified","Customer request","Other"];
const statusLabels={received:"Received",preparing:"Preparing",delivering:"Delivering",delivered:"Delivered",cancelled:"Cancelled","return process":"Return process",returned:"Returned",pending:"Pending",accepted:"Accepted",rejected:"Rejected",open:"Open","in progress":"In progress",resolved:"Resolved"};
const escape=value=>String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=(value,currency="TRY")=>{const n=Number(value);return Number.isFinite(n)?new Intl.NumberFormat("en-US",{style:"currency",currency}).format(n):"—"};
async function getToken(){let token="";try{token=sessionStorage.getItem("vn_account_session")||""}catch{}if(token)return token;await window.Clerk.load();const clerkToken=await window.Clerk.session?.getToken();if(!clerkToken)throw new Error("Sign in to your VN SHOP account first.");const response=await fetch(API+"/api/auth/exchange",{method:"POST",headers:{Authorization:"Bearer "+clerkToken}});const result=await response.json().catch(()=>({}));if(!response.ok||!result.token)throw new Error(result.error||"Secure session could not be established.");token=result.token;try{sessionStorage.setItem("vn_account_session",token)}catch{}return token}
async function request(path,options={}){const send=token=>fetch(API+path,{...options,headers:{...(options.body?{"Content-Type":"application/json"}:{}),...(options.headers||{}),Authorization:"Bearer "+token}});let response=await send(state.token);if(response.status===401){state.token="";try{sessionStorage.removeItem("vn_account_session")}catch{}state.token=await getToken();response=await send(state.token)}const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||"Request failed ("+response.status+").");return data}
function showMessage(message,error=false){$("message").textContent=message;$("message").classList.toggle("error",error);$("message").classList.remove("hidden")}
function setStats(){const active=state.orders.filter(o=>!["delivered","returned","cancelled"].includes(String(o.status).toLowerCase()));$("stat-active").textContent=active.length;$("stat-preparing").textContent=state.orders.filter(o=>o.status==="preparing").length;$("stat-delivering").textContent=state.orders.filter(o=>o.status==="delivering").length;$("stat-requests").textContent=state.returns.filter(r=>!["returned","rejected"].includes(String(r.status).toLowerCase())).length+state.issues.filter(i=>!["resolved","closed"].includes(String(i.status).toLowerCase())).length}
function render(){setStats();const rows=state.tab==="orders"?state.orders:state.tab==="returns"?state.returns:state.issues;const q=state.query.toLowerCase();const filtered=rows.filter(r=>{const text=[r.order_number,r.orderNumber,r.vn_code,r.vnCode,r.customer?.email,r.customer_email,r.customer?.firstName,r.customer?.lastName,r.email,r.description].join(" ").toLowerCase();return(!q||text.includes(q))&&(state.filter==="all"||String(r.status).toLowerCase()===state.filter)});$("list").innerHTML=filtered.length?filtered.map(state.tab==="orders"?orderCard:state.tab==="returns"?returnCard:issueCard).join(""):'<div class="empty">No records found.</div>';const opts=state.tab==="orders"?["all","received","preparing","delivering","delivered","cancelled","return process","returned"]:state.tab==="returns"?["all","pending","accepted","return process","returned","rejected"]:["all","open","in progress","resolved"];const current=$("filter").value;$("filter").innerHTML=opts.map(v=>'<option value="'+escape(v)+'">'+(v==="all"?"All statuses":escape(statusLabels[v]||v))+"</option>").join("");$("filter").value=opts.includes(current)?current:"all"}
function orderCard(o){const internal=o.order_type==="account"||o.source==="account"||o.is_internal_order===true;const id=escape(o.id||o.order_id);const name=[o.customer?.firstName||o.first_name,o.customer?.lastName||o.last_name].filter(Boolean).join(" ")||o.customer?.email||o.customer_email||o.email||"Customer";const lines=(o.items||[]).map(x=>escape(x.name||x.product_name||x.title)+" × "+escape(x.quantity||1)).join(" · ");const controls=internal?'<select data-action="status" data-id="'+id+'"><option value="">Choose final status</option><option value="delivered">Delivered</option><option value="returned">Returned</option></select>':'<select data-action="status" data-id="'+id+'"><option value="">Change status</option><option value="preparing">Preparing</option><option value="delivering">Delivering</option><option value="delivered">Delivered</option><option value="cancelled">Cancel order</option></select>';return '<article class="order"><div><h2>#'+escape(o.order_number||o.orderNumber||"—")+'</h2><div class="meta">'+escape(o.vn_code||o.vnCode||"")+' · '+escape(name)+'</div><div class="items">'+lines+'</div></div><div><span class="status" data-status="'+escape(o.status)+'">'+escape(statusLabels[o.status]||o.status||"Received")+'</span><div class="meta" style="margin-top:8px">'+escape(o.created_at||o.createdAt||"")+'</div></div><div><strong>'+money(o.total,o.currency||"TRY")+'</strong><div class="meta">'+(internal?"Account order":"Customer order")+'</div></div><div class="actions">'+controls+'<button class="secondary" data-action="details" data-id="'+id+'">Details</button></div></article>'}
function returnCard(r){const id=escape(r.id||r.return_id);return '<article class="order"><div><h2>Return · #'+escape(r.order_number||r.orderNumber||"—")+'</h2><div class="meta">'+escape(r.vn_code||r.vnCode||r.customer_email||"")+'</div><div class="items">'+escape(r.reason||r.description||"Return request")+'</div></div><div><span class="status">'+escape(statusLabels[r.status]||r.status)+'</span><div class="meta" style="margin-top:8px">Requested: '+escape(r.created_at||r.createdAt||"")+'</div></div><div class="meta">'+escape(r.customer_email||r.email||"")+'</div><div class="actions">'+(r.status==="pending"?'<button data-action="return-accept" data-id="'+id+'">Accept</button><button class="secondary" data-action="return-reject" data-id="'+id+'">Reject</button>':"")+(r.status==="return process"?'<button data-action="return-complete" data-id="'+id+'">Mark returned</button>':"")+'</div></article>'}
function issueCard(i){const id=escape(i.id||i.issue_id);return '<article class="order"><div><h2>#'+escape(i.order_number||i.orderNumber||"—")+'</h2><div class="meta">'+escape(i.customer_email||i.email||"")+'</div><div class="items">'+escape(i.description||i.issue_type||"Customer report")+'</div></div><div><span class="status">'+escape(statusLabels[i.status]||i.status)+'</span><div class="meta" style="margin-top:8px">Reported: '+escape(i.reported_at||i.created_at||"")+'</div></div><div class="meta">Started: '+escape(i.processing_started_at||"—")+'<br>Resolved: '+escape(i.resolved_at||"—")+'</div><div class="actions">'+(i.status==="open"?'<button data-action="issue-start" data-id="'+id+'">Start processing</button>':"")+(i.status==="in progress"?'<button data-action="issue-resolve" data-id="'+id+'">Resolve report</button>':"")+'</div></article>'}
async function load(){showMessage("Loading records…");try{const [orders,returns,issues]=await Promise.all([request("/api/operations/orders"),request("/api/operations/returns"),request("/api/operations/issues")]);state.orders=orders.orders||[];state.returns=returns.returns||[];state.issues=issues.issues||[];$("message").classList.add("hidden");render()}catch(e){showMessage(e.message,true);$("list").innerHTML='<div class="empty">Records could not be loaded. The order-management API must be available for this panel.</div>'}}
function openModal(title,fields,pending){state.pending=pending;$("modal-title").textContent=title;$("modal-body").innerHTML=fields;$("modal").classList.remove("hidden")}
function closeModal(){$("modal").classList.add("hidden");state.pending=null}
async function saveModal(){if(!state.pending)return;const data={};$("modal-body").querySelectorAll("[name]").forEach(el=>data[el.name]=el.value);try{await state.pending(data);closeModal();await load()}catch(e){showMessage(e.message,true)}}
$("list").addEventListener("change",async e=>{const el=e.target.closest('[data-action="status"]');if(!el||!el.value)return;const id=el.dataset.id,value=el.value;el.disabled=true;try{if(value==="cancelled"){openModal("Cancel order",'<div class="field"><label>Cancellation reason</label><select name="reason" required>'+cancelReasons.map(x=>'<option>'+escape(x)+'</option>').join("")+'</select></div>',async data=>{await request("/api/operations/orders/"+encodeURIComponent(id)+"/status",{method:"PATCH",body:JSON.stringify({status:value,cancellation_reason:data.reason})})});}else{await request("/api/operations/orders/"+encodeURIComponent(id)+"/status",{method:"PATCH",body:JSON.stringify({status:value})});await load()}}catch(err){showMessage(err.message,true);el.disabled=false}});
$("list").addEventListener("click",async e=>{const b=e.target.closest("[data-action]");if(!b)return;const {action,id}=b.dataset;b.disabled=true;try{if(action==="details"){const o=state.orders.find(x=>String(x.id||x.order_id)===id);if(o)openModal("Order details",'<pre style="white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.5 monospace">'+escape(JSON.stringify(o,null,2))+'</pre>',async()=>{})}else if(action==="return-accept"||action==="return-reject"){await request("/api/operations/returns/"+encodeURIComponent(id),{method:"PATCH",body:JSON.stringify({status:action==="return-accept"?"return process":"rejected"})});await load()}else if(action==="return-complete"){await request("/api/operations/returns/"+encodeURIComponent(id),{method:"PATCH",body:JSON.stringify({status:"returned"})});await load()}else if(action==="issue-start"){await request("/api/operations/issues/"+encodeURIComponent(id),{method:"PATCH",body:JSON.stringify({status:"in progress"})});await load()}else if(action==="issue-resolve"){openModal("Resolve customer report",'<div class="field"><label>Resolution</label><textarea name="resolution" required></textarea></div>',async data=>{await request("/api/operations/issues/"+encodeURIComponent(id),{method:"PATCH",body:JSON.stringify({status:"resolved",resolution:data.resolution})})})}}catch(err){showMessage(err.message,true)}finally{b.disabled=false}});
document.querySelectorAll("[data-tab]").forEach(b=>b.addEventListener("click",()=>{state.tab=b.dataset.tab;document.querySelectorAll("[data-tab]").forEach(x=>x.setAttribute("aria-selected",String(x===b)));$("filter").value="all";render()}));
$("search").addEventListener("input",e=>{state.query=e.target.value;render()});$("filter").addEventListener("change",e=>{state.filter=e.target.value;render()});$("modal-cancel").addEventListener("click",closeModal);$("modal-save").addEventListener("click",saveModal);
$("signout").addEventListener("click",async()=>{try{await window.Clerk.load();await window.Clerk.signOut()}catch{}try{sessionStorage.removeItem("vn_account_session")}catch{}location.href="merch.html"});
async function init(){try{await window.Clerk.load();if(!window.Clerk.session){$("gate-message").textContent="Sign in through your VN SHOP account, then reopen this page.";return}state.token=await getToken();const account=await request("/api/account");if(!(account.is_admin===true||account.isAdmin===true))throw new Error("This account is not authorized to access order management.");$("operator").textContent=window.Clerk.user?.primaryEmailAddress?.emailAddress||"Authorized operator";$("gate").classList.add("hidden");$("app").classList.remove("hidden");await load()}catch(e){$("gate-message").textContent=e.message;$("operator").textContent="Access unavailable"}}
init();
})();
</script>
</body>
</html>
