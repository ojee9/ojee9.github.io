<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>VN SHOP® — ORDER MANAGEMENT</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{color-scheme:dark;--bg:#090a0b;--panel:#111315;--panel2:#171a1d;--line:#34383b;--muted:#8d9295;--text:#f0f0ed;--silver:#c7cbca;--amber:#d7ad68;--red:#d66a58}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -18%,#34383b 0,transparent 47%),linear-gradient(145deg,#0d0f10,#070809 72%);color:var(--text);font:14px/1.55 Inter,Arial,sans-serif}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.16;background-image:linear-gradient(#aeb4b31a 1px,transparent 1px),linear-gradient(90deg,#aeb4b31a 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(#000,transparent 85%)}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{position:relative;max-width:1600px;margin:auto;padding:28px clamp(16px,3vw,48px) 60px}.top{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;border-bottom:1px solid var(--line);padding-bottom:22px}.eyebrow{font-size:9px;font-weight:700;letter-spacing:.25em;text-transform:uppercase;color:var(--muted)}h1{font-size:clamp(25px,4vw,42px);letter-spacing:-.065em;line-height:1.02;margin:8px 0 0;font-weight:800;color:var(--text)}.session{display:flex;align-items:center;gap:14px;color:var(--muted);font-size:10px}.plain{border:1px solid #555b5e;background:transparent;color:var(--silver);padding:10px 14px;font-size:9px;font-weight:700;letter-spacing:.13em;text-transform:uppercase}.plain:hover{background:var(--silver);color:#0b0d0e}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:22px 0}.stat{background:linear-gradient(145deg,#191c1f,#111315);border:1px solid var(--line);padding:16px 18px}.stat span{display:block;color:var(--muted);font-size:9px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}.stat strong{display:block;font-size:27px;letter-spacing:-.06em;margin-top:4px}.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:28px 0 18px;overflow:auto}.tab{border:0;background:transparent;padding:13px 18px;font-size:9px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);white-space:nowrap;border-bottom:2px solid transparent}.tab[aria-selected=true]{color:var(--text);border-color:var(--amber)}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.toolbar input,.toolbar select{background:#141719;color:var(--text);border:1px solid var(--line);padding:12px 14px;outline:none}.toolbar input{width:min(360px,100%)}.list{display:grid;gap:10px}.order{background:linear-gradient(110deg,#171a1c,#111315);border:1px solid var(--line);padding:18px;display:grid;grid-template-columns:minmax(180px,1.2fr) minmax(160px,1fr) minmax(150px,.8fr) minmax(220px,1fr);gap:18px;align-items:center}.order h2{font-size:15px;margin:0 0 4px;letter-spacing:-.03em}.meta{font-size:11px;color:var(--muted);overflow-wrap:anywhere}.items{font-size:11px;margin-top:8px}.status{display:inline-flex;border:1px solid #4b5154;padding:5px 9px;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;background:#0d1011}.status[data-status=delivered],.status[data-status=returned]{border-color:#718879}.actions{display:flex;flex-wrap:wrap;gap:7px;justify-content:flex-end}.actions select{min-width:145px;max-width:100%;padding:10px;border:1px solid var(--line);background:#0d1011;color:var(--text)}.actions button{padding:10px 12px;border:1px solid var(--silver);background:var(--silver);color:#0b0d0e;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}.actions button.secondary{background:transparent;color:var(--silver)}.empty,.notice{background:#141719;border:1px solid var(--line);padding:24px;color:var(--muted)}.notice.error{color:#ff9b8b;border-color:#8c443a}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#000d;display:grid;place-items:center;padding:18px;z-index:10}.dialog{width:min(560px,100%);max-height:85vh;overflow:auto;background:#151819;padding:24px;border:1px solid #555b5e}.dialog h2{margin:0 0 18px;font-size:20px}.field{display:grid;gap:6px;margin:14px 0}.field label{font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}.field select,.field textarea{width:100%;padding:11px;border:1px solid var(--line);background:#0d1011;color:var(--text)}.field textarea{min-height:90px;resize:vertical}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.login{min-height:calc(100vh - 150px);display:grid;place-items:center;padding:54px 12px}.login section{position:relative;isolation:isolate;overflow:hidden;width:min(590px,100%);padding:clamp(26px,5vw,52px);background:linear-gradient(145deg,#191d20,#0d0f10 72%);border:1px solid #51585b;box-shadow:0 30px 100px #0009,0 0 0 1px #ffffff08 inset}.login section:before{content:"";position:absolute;z-index:-1;inset:0;background:radial-gradient(ellipse at 92% 0,#d7ad6819,transparent 42%),linear-gradient(125deg,transparent 49.8%,#ffffff08 50%,transparent 50.2%)}.login section:after{content:"";position:absolute;z-index:-1;right:-70px;top:105px;width:280px;height:280px;border:1px solid #ffffff0c;border-radius:50%;box-shadow:0 0 0 24px #ffffff05,0 0 0 48px #ffffff03;pointer-events:none}.caution{display:flex;align-items:center;gap:12px;margin:34px 0 17px;color:#e3b46c;font-size:9px;font-weight:800;letter-spacing:.28em}.caution:before{content:"";width:34px;height:3px;background:repeating-linear-gradient(135deg,#d7ad68 0 5px,transparent 5px 9px)}.login h2{font-size:clamp(42px,7vw,68px);letter-spacing:-.085em;line-height:.88;margin-bottom:38px}.protocol{margin-bottom:0}.protocol-mark i{width:7px;height:7px}.password-wrap{position:relative}.password-wrap:after{content:"";position:absolute;right:14px;width:7px;height:7px;border:1px solid #777f82;transform:rotate(45deg);pointer-events:none}.password-wrap input{padding-right:40px}.password-submit{letter-spacing:.24em}.protocol-foot{margin-top:22px}.protocol{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:18px;border-bottom:1px solid #ffffff20}.protocol-mark{display:flex;align-items:center;gap:10px;font-size:9px;font-weight:800;letter-spacing:.22em;color:#e3e4e1}.protocol-mark i{display:block;width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 13px #d66a58a8}.protocol-code{font-size:9px;letter-spacing:.16em;color:#858b8d}.caution{display:flex;align-items:center;gap:9px;margin:28px 0 15px;color:#e3b46c;font-size:10px;font-weight:800;letter-spacing:.22em}.caution:before{content:"▲";font-size:12px}.login h2{max-width:470px;margin:0;font-size:clamp(29px,5vw,46px);line-height:.99;letter-spacing:-.07em;font-weight:800}.login p{max-width:430px;margin:17px 0 27px;color:#a5abad;font-size:12px;line-height:1.8}.password-label{display:block;margin:0 0 9px;color:#b9bfc0;font-size:9px;font-weight:800;letter-spacing:.18em}.password-wrap{display:flex;align-items:center;background:#090b0c;border:1px solid #50575a;transition:border-color .18s,box-shadow .18s}.password-wrap:focus-within{border-color:#d7ad68;box-shadow:0 0 0 2px #d7ad6818}.password-wrap input{width:100%;min-width:0;padding:16px 15px;border:0;outline:0;background:transparent;color:#f5f5f2;font-size:14px;letter-spacing:.12em}.password-wrap input::placeholder{color:#62696c;letter-spacing:.12em}.password-submit{width:100%;display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding:15px 17px;border:1px solid #d7ad68;background:#d7ad68;color:#111314;font-size:9px;font-weight:900;letter-spacing:.17em;text-transform:uppercase}.password-submit:hover{background:#e8c486}.password-submit:disabled{opacity:.5;cursor:wait}.auth-error{min-height:18px;margin-top:10px;color:#ed8b7c;font-size:11px}.protocol-foot{display:flex;justify-content:space-between;gap:12px;margin-top:28px;padding-top:16px;border-top:1px solid #ffffff20;color:#777f82;font-size:8px;letter-spacing:.15em;text-transform:uppercase}.spinner{padding:48px;text-align:center;color:var(--muted)}@media(max-width:900px){.order{grid-template-columns:1fr 1fr}.actions{justify-content:flex-start}}@media(max-width:560px){.shell{padding:18px 12px 40px}.top{align-items:flex-start;flex-direction:column}.stats{grid-template-columns:1fr 1fr}.order{grid-template-columns:1fr;gap:12px}.toolbar{align-items:stretch;flex-direction:column}.toolbar input{width:100%}.session{width:100%;justify-content:space-between}.login{min-height:calc(100vh - 200px);padding:32px 6px}.protocol-foot{font-size:7px}}
</style>

</head>
<body>
<main class="shell">
<header class="top"><div><div class="eyebrow">VN SHOP® / VNION RECORDS</div><h1>ORDER MANAGEMENT</h1></div><div class="session"><span id="operator">IDENTITY CHECK IN PROGRESS</span><button class="plain" id="signout" type="button">Sign out</button></div></header>
<section id="app" class="hidden">
<div class="stats"><div class="stat"><span>Active orders</span><strong id="stat-active">—</strong></div><div class="stat"><span>Preparing</span><strong id="stat-preparing">—</strong></div><div class="stat"><span>Delivering</span><strong id="stat-delivering">—</strong></div><div class="stat"><span>Open requests</span><strong id="stat-requests">—</strong></div></div>
<nav class="tabs" aria-label="Order management sections">
<button class="tab" data-tab="orders" aria-selected="true">Orders</button><button class="tab" data-tab="returns" aria-selected="false">Returns</button><button class="tab" data-tab="issues" aria-selected="false">Customer reports</button>
</nav>
<div class="toolbar"><input id="search" type="search" placeholder="Search order, VN code, customer…" autocomplete="off"><select id="filter"><option value="all">All statuses</option></select></div>
<div id="message" class="notice hidden" role="status"></div><div id="list" class="list"><div class="spinner">Loading records…</div></div>
</section>
<section id="gate" class="login"><section>
<div class="protocol"><div class="protocol-mark"><i></i><span>VN SHOP®</span></div><div class="protocol-code">01 / 09</div></div>
<div class="caution">CAUTION</div>
<h2>SECURED<br>ACCESS</h2>
<form id="password-form" autocomplete="on">
<label class="password-label" for="admin-password">ADMIN PASSWORD</label>
<div class="password-wrap"><input id="admin-password" name="password" type="password" placeholder="••••••••••••" autocomplete="current-password" required minlength="1"></div>
<button class="password-submit" id="password-submit" type="submit"><span>UNLOCK</span><span>↗</span></button>
<div class="auth-error" id="auth-error" role="alert" aria-live="polite"></div>
</form>
<div class="protocol-foot"><span>VN-OM</span><span>01</span></div>
</section></section>
</main>
<div id="modal" class="modal hidden" role="dialog" aria-modal="true"><section class="dialog"><h2 id="modal-title">Update record</h2><div id="modal-body"></div><div class="dialog-actions"><button class="plain" id="modal-cancel" type="button">Cancel</button><button class="plain" id="modal-save" type="button">Save changes</button></div></section></div>
<script>
(()=>{"use strict";
const API="https://vn-shop-account-api.9ojeez9.workers.dev";
const $=id=>document.getElementById(id);
const state={token:"",tab:"orders",orders:[],returns:[],issues:[],filter:"all",query:"",pending:null};
const cancelReasons=["High workload","Out of stock","Suspicious purchase","Address or delivery information issue","Product unavailable","Payment could not be verified","Customer request","Other"];
const statusLabels={received:"Received",preparing:"Preparing",delivering:"Delivering",delivered:"Delivered",cancelled:"Cancelled","return process":"Return process",returned:"Returned",pending:"Pending",accepted:"Accepted",rejected:"Rejected",open:"Open","in progress":"In progress",resolved:"Resolved"};
const escape=value=>String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=(value,currency="TRY")=>{const n=Number(value);return Number.isFinite(n)?new Intl.NumberFormat("en-US",{style:"currency",currency}).format(n):"—"};
async function getToken(){const token=state.token||sessionStorage.getItem("vn_order_management_session")||"";if(!token)throw new Error("Enter the administrator password to continue.");state.token=token;return token}
async function request(path,options={}){const token=await getToken();const response=await fetch(API+path,{...options,headers:{...(options.body?{"Content-Type":"application/json"}:{}),...(options.headers||{}),Authorization:"Bearer "+token}});const data=await response.json().catch(()=>({}));if(response.status===401){state.token="";sessionStorage.removeItem("vn_order_management_session");throw new Error("Your secure session expired. Enter the administrator password again.")}if(!response.ok)throw new Error(data.error||"Request failed ("+response.status+").");return data}
function showMessage(message,error=false){$("message").textContent=message;$("message").classList.toggle("error",error);$("message").classList.remove("hidden")}
function setStats(){const active=state.orders.filter(o=>!["delivered","returned","cancelled"].includes(String(o.status).toLowerCase()));$("stat-active").textContent=active.length;$("stat-preparing").textContent=state.orders.filter(o=>o.status==="preparing").length;$("stat-delivering").textContent=state.orders.filter(o=>o.status==="delivering").length;$("stat-requests").textContent=state.returns.filter(r=>!["returned","rejected"].includes(String(r.status).toLowerCase())).length+state.issues.filter(i=>!["resolved","closed"].includes(String(i.status).toLowerCase())).length}
function render(){setStats();const rows=state.tab==="orders"?state.orders:state.tab==="returns"?state.returns:state.issues;const q=state.query.toLowerCase();const filtered=rows.filter(r=>{const text=[r.order_number,r.orderNumber,r.vn_code,r.vnCode,r.customer?.email,r.customer_email,r.customer?.firstName,r.customer?.lastName,r.email,r.description].join(" ").toLowerCase();return(!q||text.includes(q))&&(state.filter==="all"||String(r.status).toLowerCase()===state.filter)});$("list").innerHTML=filtered.length?filtered.map(state.tab==="orders"?orderCard:state.tab==="returns"?returnCard:issueCard).join(""):'<div class="empty">No records found.</div>';const opts=state.tab==="orders"?["all","received","preparing","delivering","delivered","cancelled","return process","returned"]:state.tab==="returns"?["all","pending","accepted","return process","returned","rejected"]:["all","open","in progress","resolved"];const current=$("filter").value;$("filter").innerHTML=opts.map(v=>'<option value="'+escape(v)+'">'+(v==="all"?"All statuses":escape(statusLabels[v]||v))+"</option>").join("");$("filter").value=opts.includes(current)?current:"all"}
function orderCard(o){const internal=o.order_type==="account"||o.source==="account"||o.is_internal_order===true;const id=escape(o.id||o.order_id);const name=[o.customer?.firstName||o.first_name,o.customer?.lastName||o.last_name].filter(Boolean).join(" ")||o.customer?.email||o.customer_email||o.email||"Customer";const lines=(o.items||[]).map(x=>escape(x.name||x.product_name||x.title)+" × "+escape(x.quantity||1)).join(" · ");const controls=internal?'<select data-action="status" data-id="'+id+'"><option value="">Choose final status</option><option value="delivered">Delivered</option><option value="returned">Returned</option></select>':'<select data-action="status" data-id="'+id+'"><option value="">Change status</option><option value="preparing">Preparing</option><option value="delivering">Delivering</option><option value="delivered">Delivered</option><option value="cancelled">Cancel order</option></select>';return '<article class="order"><div><h2>#'+escape(o.order_number||o.orderNumber||"—")+'</h2><div class="meta">'+escape(o.vn_code||o.vnCode||"")+' · '+escape(name)+'</div><div class="items">'+lines+'</div></div><div><span class="status" data-status="'+escape(o.status)+'">'+escape(statusLabels[o.status]||o.status||"Received")+'</span><div class="meta" style="margin-top:8px">'+escape(o.created_at||o.createdAt||"")+'</div></div><div><strong>'+money(o.total,o.currency||"TRY")+'</strong><div class="meta">'+(internal?"Account order":"Customer order")+'</div></div><div class="actions">'+controls+'<button class="secondary" data-action="details" data-id="'+id+'">Details</button></div></article>'}
function returnCard(r){const id=escape(r.id||r.return_id);return '<article class="order"><div><h2>Return · #'+escape(r.order_number||r.orderNumber||"—")+'</h2><div class="meta">'+escape(r.vn_code||r.vnCode||r.customer_email||"")+'</div><div class="items">'+escape(r.reason||r.description||"Return request")+'</div></div><div><span class="status">'+escape(statusLabels[r.status]||r.status)+'</span><div class="meta" style="margin-top:8px">Requested: '+escape(r.created_at||r.createdAt||"")+'</div></div><div class="meta">'+escape(r.customer_email||r.email||"")+'</div><div class="actions">'+(r.status==="pending"?'<button data-action="return-accept" data-id="'+id+'">Accept</button><button class="secondary" data-action="return-reject" data-id="'+id+'">Reject</button>':"")+(r.status==="return process"?'<button data-action="return-complete" data-id="'+id+'">Mark returned</button>':"")+'</div></article>'}
function issueCard(i){const id=escape(i.id||i.issue_id);return '<article class="order"><div><h2>#'+escape(i.order_number||i.orderNumber||"—")+'</h2><div class="meta">'+escape(i.customer_email||i.email||"")+'</div><div class="items">'+escape(i.description||i.issue_type||"Customer report")+'</div></div><div><span class="status">'+escape(statusLabels[i.status]||i.status)+'</span><div class="meta" style="margin-top:8px">Reported: '+escape(i.reported_at||i.created_at||"")+'</div></div><div class="meta">Started: '+escape(i.processing_started_at||"—")+'<br>Resolved: '+escape(i.resolved_at||"—")+'</div><div class="actions">'+(i.status==="open"?'<button data-action="issue-start" data-id="'+id+'">Start processing</button>':"")+(i.status==="in progress"?'<button data-action="issue-resolve" data-id="'+id+'">Resolve report</button>':"")+'</div></article>'}
async function load(){showMessage("Loading records…");try{const [orders,returns,issues]=await Promise.all([request("/api/operations/orders"),request("/api/operations/returns"),request("/api/operations/issues")]);state.orders=orders.orders||[];state.returns=returns.returns||[];state.issues=issues.issues||[];$("message").classList.add("hidden");render()}catch(e){showMessage(e.message,true);$("list").innerHTML='<div class="empty">Records could not be loaded. The order-management API must be available for this panel.</div>'}}
function openModal(title,fields,pending){state.pending=pending;$("modal-title").textContent=title;$("modal-body").innerHTML=fields;$("modal").classList.remove("hidden")}
function closeModal(){$("modal").classList.add("hidden");state.pending=null}
async function saveModal(){if(!state.pending)return;const data={};$("modal-body").querySelectorAll("[name]").forEach(el=>data[el.name]=el.value);try{await state.pending(data);closeModal();await load()}catch(e){showMessage(e.message,true)}}
$("list").addEventListener("change",async e=>{const el=e.target.closest('[data-action="status"]');if(!el||!el.value)return;const id=el.dataset.id,value=el.value;el.disabled=true;try{if(value==="cancelled"){openModal("Cancel order",'<div class="field"><label>Cancellation reason</label><select name="reason" required>'+cancelReasons.map(x=>'<option>'+escape(x)+'</option>').join("")+'</select></div>',async data=>{await request("/api/operations/orders/"+encodeURIComponent(id)+"/status",{method:"PATCH",body:JSON.stringify({status:value,cancellation_reason:data.reason})})});}else{await request("/api/operations/orders/"+encodeURIComponent(id)+"/status",{method:"PATCH",body:JSON.stringify({status:value})});await load()}}catch(err){showMessage(err.message,true);el.disabled=false}});
$("list").addEventListener("click",async e=>{const b=e.target.closest("[data-action]");if(!b)return;const {action,id}=b.dataset;b.disabled=true;try{if(action==="details"){const o=state.orders.find(x=>String(x.id||x.order_id)===id);if(o)openModal("Order details",'<pre style="white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.5 monospace">'+escape(JSON.stringify(o,null,2))+'</pre>',async()=>{})}else if(action==="return-accept"||action==="return-reject"){await request("/api/operations/returns/"+encodeURIComponent(id),{method:"PATCH",body:JSON.stringify({status:action==="return-accept"?"return process":"rejected"})});await load()}else if(action==="return-complete"){await request("/api/operations/returns/"+encodeURIComponent(id),{method:"PATCH",body:JSON.stringify({status:"returned"})});await load()}else if(action==="issue-start"){await request("/api/operations/issues/"+encodeURIComponent(id),{method:"PATCH",body:JSON.stringify({status:"in progress"})});await load()}else if(action==="issue-resolve"){openModal("Resolve customer report",'<div class="field"><label>Resolution</label><textarea name="resolution" required></textarea></div>',async data=>{await request("/api/operations/issues/"+encodeURIComponent(id),{method:"PATCH",body:JSON.stringify({status:"resolved",resolution:data.resolution})})})}}catch(err){showMessage(err.message,true)}finally{b.disabled=false}});
document.querySelectorAll("[data-tab]").forEach(b=>b.addEventListener("click",()=>{state.tab=b.dataset.tab;document.querySelectorAll("[data-tab]").forEach(x=>x.setAttribute("aria-selected",String(x===b)));$("filter").value="all";render()}));
$("search").addEventListener("input",e=>{state.query=e.target.value;render()});$("filter").addEventListener("change",e=>{state.filter=e.target.value;render()});$("modal-cancel").addEventListener("click",closeModal);$("modal-save").addEventListener("click",saveModal);
$("signout").addEventListener("click",()=>{state.token="";sessionStorage.removeItem("vn_order_management_session");$("app").classList.add("hidden");$("gate").classList.remove("hidden");$("admin-password").value="";$("auth-error").textContent="";$("operator").textContent="ACCESS LOCKED"}); 
$("password-form").addEventListener("submit",async event=>{event.preventDefault();const password=$("admin-password").value;const button=$("password-submit");const error=$("auth-error");button.disabled=true;error.textContent="VERIFYING CREDENTIALS…";try{const response=await fetch(API+"/api/operations/auth",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password})});const result=await response.json().catch(()=>({}));if(!response.ok||!result.token)throw new Error(result.error||"Authentication service is unavailable.");state.token=result.token;sessionStorage.setItem("vn_order_management_session",result.token);$("admin-password").value="";$("gate").classList.add("hidden");$("app").classList.remove("hidden");$("operator").textContent="AUTHORIZED OPERATOR";await load()}catch(error){error.textContent=error.message;$("admin-password").value="";$("admin-password").focus()}finally{button.disabled=false}});
async function init(){const token=sessionStorage.getItem("vn_order_management_session");if(!token){$("operator").textContent="ACCESS LOCKED";return}state.token=token;$("operator").textContent="RESTORING SECURE SESSION";$("gate").classList.add("hidden");$("app").classList.remove("hidden");try{await load()}catch(error){state.token="";sessionStorage.removeItem("vn_order_management_session");$("app").classList.add("hidden");$("gate").classList.remove("hidden");$("operator").textContent="ACCESS LOCKED";$("auth-error").textContent=error.message}}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init,{once:true});else init();
})();
</script>
</body>
</html>
