
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Explore artwork, official covers, draft archives and motion visuals.">
  <title>Artwork | OJEE</title>
  <link rel="stylesheet" href="visuals.css">
  <script src="visual.js?v=5" defer></script>
</head>
<body>
  <a href="space.html" class="back-btn">← SPACE</a>

  <main class="gallery-room">
    <div class="wall-light" aria-hidden="true"></div>

    <section class="gallery-space" aria-label="Visual archive">
      <nav class="visual-filter" aria-label="Filter artwork">
        <button class="active" type="button" data-filter="featured" aria-pressed="true">FEATURED</button>
        <button type="button" data-filter="hot-take" aria-pressed="false">HOT TAKE</button>
        <button type="button" data-filter="play-this" aria-pressed="false">PLAY THIS</button>
        <button type="button" data-filter="newest" aria-pressed="false">NEWEST</button>
        <button type="button" data-filter="all" aria-pressed="false">ALL</button>
      </nav>

      <section class="visual-grid" aria-label="Artwork gallery">

        <!-- 9OJEEZ9 SKETCHY ART -->
        <article class="visual-card official featured hot-take"
          data-title="9OJEEZ9 SKETCHY ART"
          data-kind="OFFICIAL ARTWORK">

          <div class="card-badges">
            <span class="card-badge new">NEW</span>
            <span class="card-badge hot">HOT</span>
          </div>

          <button class="media-trigger image-box" type="button"
            aria-label="View 9ojeez9 Sketchy Art">
            <img
              src="assets/officials/9ojeez9-sketchy-art.png"
              alt="9ojeez9 Sketchy Art">
          </button>

          <div class="card-info">
            <h2>9OJEEZ9 SKETCHY ART</h2>
            <p>OFFICIAL ARTWORK</p>
          </div>
        </article>

        <!-- E.N.L.9 COVER -->
        <article class="visual-card official featured"
          data-title="E.N.L.9"
          data-kind="OFFICIAL COVER">

          <div class="card-badges">
            <span class="card-badge new">NEW</span>
          </div>

          <button class="media-trigger image-box" type="button"
            aria-label="View E.N.L.9 cover">
            <img
              src="assets/officials/e.n.l.9-cover.png"
              alt="E.N.L.9 official cover">
          </button>

          <div class="card-info">
            <h2>E.N.L.9</h2>
            <p>OFFICIAL COVER</p>
          </div>
        </article>

        <!-- DE FORMULA -->
        <article class="visual-card official featured"
          data-title="DE FORMULĀ HŪMĀNĀ"
          data-kind="OFFICIAL COVER">

          <button class="media-trigger image-box" type="button"
            aria-label="View DE FORMULĀ HŪMĀNĀ artwork">
            <img
              src="assets/officials/de-formula-humana-cover.JPG"
              alt="DE FORMULĀ HŪMĀNĀ official cover">
          </button>

          <div class="card-info">
            <h2>DE FORMULĀ HŪMĀNĀ</h2>
            <p>OFFICIAL COVER</p>
          </div>
        </article>

        <!-- SUBCITY OFFICIAL -->
        <article class="visual-card official featured hot-take"
          data-title="SUBCITY"
          data-kind="OFFICIAL ARTWORK">

          <div class="card-badges">
            <span class="card-badge hot">HOT</span>
          </div>

          <button class="media-trigger image-box" type="button"
            aria-label="View SUBCITY official artwork">
            <img
              src="assets/officials/subcity-cover.png"
              alt="SUBCITY official artwork">
          </button>

          <div class="card-info">
            <h2>SUBCITY</h2>
            <p>OFFICIAL ARTWORK</p>
          </div>
        </article>

        <!-- SUBCITY DRAFT ARCHIVE -->
        <article class="visual-card pocket experimental"
          data-title="SUBCITY"
          data-kind="DRAFT ARCHIVE">

          <div class="mini-grid">
            <button class="media-trigger" type="button"
              aria-label="View SUBCITY draft 1">
              <img
                src="assets/drafts/subcity-draft-1.png"
                alt="SUBCITY draft 1">
            </button>

            <button class="media-trigger" type="button"
              aria-label="View SUBCITY draft 2">
              <img
                src="assets/drafts/subcity-draft-2.png"
                alt="SUBCITY draft 2">
            </button>

            <button class="media-trigger" type="button"
              aria-label="View SUBCITY original cover draft">
              <img
                src="assets/drafts/subcity-original-cover.png"
                alt="SUBCITY original cover draft">
            </button>

            <button class="media-trigger" type="button"
              aria-label="View SUBCITY blurred cover draft">
              <img
                src="assets/drafts/subcity-blurred-cover.png"
                alt="SUBCITY blurred cover draft">
            </button>
          </div>

          <div class="card-info">
            <h2>SUBCITY</h2>
            <p>DRAFT ARCHIVE · 4 VERSIONS</p>
          </div>
        </article>

        <!-- SUBCITY TRACK CANVAS -->
        <article class="visual-card motion"
          data-title="SUBCITY TRACK CANVAS"
          data-kind="VIDEO PREVIEW">

          <button class="media-trigger video-trigger" type="button"
            aria-label="View SUBCITY TRACK CANVAS">
            <video autoplay muted loop playsinline preload="metadata">
              <source
                src="assets/motions/subcity-track-canvas-social-addon.mp4?v=4"
                type="video/mp4">
            </video>
            <span class="play-mark" aria-hidden="true">↗</span>
          </button>

          <div class="card-info">
            <h2>SUBCITY TRACK CANVAS</h2>
            <p>VIDEO PREVIEW</p>
          </div>
        </article>

        <!-- SUBCITY MOTION -->
        <article class="visual-card motion"
          data-title="SUBCITY MOTION"
          data-kind="VIDEO PREVIEW">

          <button class="media-trigger video-trigger" type="button"
            aria-label="View SUBCITY motion preview">
            <video autoplay muted loop playsinline preload="metadata">
              <source
                src="assets/motions/subcity-original-canvas.mp4?v=4"
                type="video/mp4">
            </video>
            <span class="play-mark" aria-hidden="true">↗</span>
          </button>

          <div class="card-info">
            <h2>SUBCITY MOTION</h2>
            <p>VIDEO PREVIEW</p>
          </div>
        </article>

      </section>
    </section>
  </main>

  <!-- LIGHTBOX -->
  <div class="lightbox" id="lightbox" aria-hidden="true">
    <div class="lightbox-backdrop" data-close-lightbox></div>

    <section
      class="lightbox-panel"
      role="dialog"
      aria-modal="true"
      aria-labelledby="lightbox-title">

      <button
        class="lightbox-close"
        type="button"
        aria-label="Close artwork viewer"
        data-close-lightbox>×</button>

      <div class="lightbox-media" id="lightbox-media"></div>

      <div class="lightbox-caption">
        <h2 id="lightbox-title"></h2>
        <p id="lightbox-kind"></p>
      </div>
    </section>
  </div>
</body>
</html>
