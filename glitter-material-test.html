<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#e4e3e1">
<title>Glitter Material Study 07 — Stochastic Film</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}
body{overflow:hidden;color:#17151a;background-color:#e4e3e1;background-image:radial-gradient(ellipse at 26% 28%,rgba(177,218,255,.34),transparent 43%),radial-gradient(ellipse at 76% 72%,rgba(255,190,226,.38),transparent 46%),radial-gradient(ellipse at 52% 48%,rgba(255,255,255,.56),transparent 54%);font-family:Arial,Helvetica,sans-serif}
#glitter{position:fixed;inset:0;width:100%;height:100%;display:block}
.meta{position:fixed;left:22px;bottom:20px;z-index:2;padding:10px 13px;border:1px solid rgba(30,25,35,.16);border-radius:8px;background:rgba(255,255,255,.34);backdrop-filter:blur(10px);font-size:11px;line-height:1.55;letter-spacing:.035em;color:rgba(20,18,24,.76)}
.meta strong{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#17151a}
.hint{position:fixed;right:22px;bottom:24px;z-index:2;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:rgba(20,18,24,.58)}
@media(max-width:600px){.meta{left:12px;bottom:12px}.hint{right:12px;bottom:16px;font-size:9px}}
</style>
</head>
<body>
<canvas id="glitter" aria-label="Stochastically distributed flat-film iridescent glitter material study"></canvas>
<div class="meta"><strong>Glitter material · study 07</strong>Stochastic flat-film field · dense micro-flakes<br>Angle-responsive pink / blue / silver reflections</div>
<div class="hint">Move pointer to shift reflection angle</div>
<script>
(() => {
const canvas=document.getElementById('glitter');
const gl=canvas.getContext('webgl2',{alpha:true,antialias:true,premultipliedAlpha:false,powerPreference:'high-performance'});
if(!gl){document.querySelector('.meta').innerHTML='<strong>WebGL 2 unavailable</strong>This browser or device cannot display the material preview.';return;}
const vertexSource=`#version 300 es
precision highp float;
in vec2 aPosition;
in vec3 aNormal;
in vec2 aOptics;
uniform vec2 uResolution;
out vec3 vNormal;
out vec2 vOptics;
void main(){
  vec2 clip=(aPosition/uResolution)*2.0-1.0;
  gl_Position=vec4(clip,0.0,1.0);
  vNormal=aNormal;
  vOptics=aOptics;
}`;
const fragmentSource=`#version 300 es
precision highp float;
uniform vec2 uPointer;
uniform vec2 uResolution;
in vec3 vNormal;
in vec2 vOptics;
out vec4 outColor;
vec3 spectrum(float h){
  return 0.52+0.48*cos(6.2831853*(h+vec3(0.00,0.34,0.67)));
}
void main(){
  vec2 p=uPointer/uResolution;
  vec3 L=normalize(vec3((p.x-0.5)*0.95,(0.5-p.y)*0.72,0.92));
  vec3 H=normalize(L+vec3(0.0,0.0,1.0));
  vec3 N=normalize(vNormal);
  float ndh=max(dot(N,H),0.0);
  float facing=max(dot(N,L),0.0);
  float hue=fract(vOptics.x+(1.0-facing)*0.42+ndh*0.08);
  vec3 irid=spectrum(hue);
  float glint=pow(ndh,mix(28.0,92.0,vOptics.y));
  float sheen=pow(ndh,8.0);
  vec3 silver=vec3(0.91,0.93,0.97);
  vec3 color=mix(irid,silver,0.22+0.28*vOptics.y);
  color=color*(0.56+0.24*sheen)+irid*glint*0.72+vec3(1.0)*pow(ndh,150.0)*0.62;
  float alpha=0.56+0.30*glint+0.08*sheen;
  outColor=vec4(color,alpha);
}`;
function compile(type,source){
  const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){const m=gl.getShaderInfoLog(s);gl.deleteShader(s);throw new Error(m);}
  return s;
}
try{
  const program=gl.createProgram();
  gl.attachShader(program,compile(gl.VERTEX_SHADER,vertexSource));
  gl.attachShader(program,compile(gl.FRAGMENT_SHADER,fragmentSource));
  gl.linkProgram(program);
  if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(program));
  gl.useProgram(program);
  const positionLoc=gl.getAttribLocation(program,'aPosition');
  const normalLoc=gl.getAttribLocation(program,'aNormal');
  const opticsLoc=gl.getAttribLocation(program,'aOptics');
  const resolutionLoc=gl.getUniformLocation(program,'uResolution');
  const pointerLoc=gl.getUniformLocation(program,'uPointer');
  const buffer=gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER,buffer);
  gl.enableVertexAttribArray(positionLoc);
  gl.enableVertexAttribArray(normalLoc);
  gl.enableVertexAttribArray(opticsLoc);
  gl.vertexAttribPointer(positionLoc,2,gl.FLOAT,false,7*4,0);
  gl.vertexAttribPointer(normalLoc,3,gl.FLOAT,false,7*4,2*4);
  gl.vertexAttribPointer(opticsLoc,2,gl.FLOAT,false,7*4,5*4);
  let pointer=[innerWidth*.5,innerHeight*.5];
  let vertexCount=0;
  let lastW=0,lastH=0,lastDpr=0;
  function randomFactory(seed){
    let s=seed>>>0;
    return ()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};
  }
  function buildField(w,h,dpr){
    const rand=randomFactory(9072026);
    const minDist=3.25*dpr;
    const cell=minDist/Math.SQRT2;
    const cols=Math.ceil(w/cell),rows=Math.ceil(h/cell);
    const grid=new Int32Array(cols*rows);grid.fill(-1);
    const points=[];
    const active=[];
    const maxPoints=135000;
    function add(x,y){
      const index=points.length;
      points.push([x,y]);
      const gx=Math.min(cols-1,Math.floor(x/cell));
      const gy=Math.min(rows-1,Math.floor(y/cell));
      grid[gy*cols+gx]=index;
      active.push(index);
    }
    add(rand()*w,rand()*h);
    while(active.length&&points.length<maxPoints){
      const ai=Math.floor(rand()*active.length);
      const origin=points[active[ai]];
      let accepted=false;
      for(let k=0;k<12;k++){
        const angle=rand()*Math.PI*2;
        const radius=minDist*(1.0+rand());
        const x=origin[0]+Math.cos(angle)*radius;
        const y=origin[1]+Math.sin(angle)*radius;
        if(x<0||y<0||x>=w||y>=h)continue;
        const gx=Math.floor(x/cell),gy=Math.floor(y/cell);
        let valid=true;
        for(let oy=-2;oy<=2&&valid;oy++)for(let ox=-2;ox<=2;ox++){
          const xx=gx+ox,yy=gy+oy;
          if(xx<0||yy<0||xx>=cols||yy>=rows)continue;
          const pi=grid[yy*cols+xx];
          if(pi>=0){const dx=x-points[pi][0],dy=y-points[pi][1];if(dx*dx+dy*dy<minDist*minDist){valid=false;break;}}
        }
        if(valid){add(x,y);accepted=true;break;}
      }
      if(!accepted)active.splice(ai,1);
    }
    const data=[];
    function vertex(x,y,nx,ny,nz,hue,sharp){data.push(x,y,nx,ny,nz,hue,sharp);}
    for(let i=0;i<points.length;i++){
      const [cx,cy]=points[i];
      const angle=rand()*Math.PI*2;
      const sides=3+Math.floor(rand()*4);
      const width=(0.72+rand()*0.78)*dpr;
      const height=width*(0.58+rand()*0.66);
      const tiltAngle=rand()*Math.PI*2;
      const tilt=0.12+rand()*0.66;
      const nx=Math.cos(tiltAngle)*tilt;
      const ny=Math.sin(tiltAngle)*tilt;
      const nz=Math.sqrt(Math.max(0.1,1.0-tilt*tilt));
      const hue=rand();
      const sharp=rand();
      const phase=rand()*0.32;
      const verts=[];
      for(let j=0;j<sides;j++){
        const a=angle+(j/sides)*Math.PI*2;
        const irregular=0.78+rand()*0.42;
        const rx=Math.cos(a)*width*irregular;
        const ry=Math.sin(a)*height*irregular;
        verts.push([cx+rx*Math.cos(angle)-ry*Math.sin(angle),cy+rx*Math.sin(angle)+ry*Math.cos(angle)]);
      }
      for(let j=0;j<sides;j++){
        const a=verts[j],b=verts[(j+1)%sides];
        vertex(cx,cy,nx,ny,nz,hue+phase,sharp);
        vertex(a[0],a[1],nx,ny,nz,hue+phase,sharp);
        vertex(b[0],b[1],nx,ny,nz,hue+phase,sharp);
      }
    }
    gl.bindBuffer(gl.ARRAY_BUFFER,buffer);
    gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(data),gl.STATIC_DRAW);
    vertexCount=data.length/7;
    lastW=w;lastH=h;lastDpr=dpr;
  }
  function resize(){
    const dpr=Math.min(devicePixelRatio||1,1.5);
    const w=Math.max(1,Math.floor(innerWidth*dpr));
    const h=Math.max(1,Math.floor(innerHeight*dpr));
    if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;gl.viewport(0,0,w,h);}
    if(w!==lastW||h!==lastH||dpr!==lastDpr)buildField(w,h,dpr);
  }
  addEventListener('resize',resize);
  addEventListener('pointermove',e=>{pointer=[e.clientX,innerHeight-e.clientY];},{passive:true});
  resize();
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
  gl.clearColor(0,0,0,0);
  function draw(){
    resize();
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform2f(resolutionLoc,canvas.width,canvas.height);
    gl.uniform2f(pointerLoc,pointer[0]*canvas.width/innerWidth,canvas.height-pointer[1]*canvas.height/innerHeight);
    gl.drawArrays(gl.TRIANGLES,0,vertexCount);
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
}catch(error){
  document.querySelector('.meta').innerHTML='<strong>Material preview could not start</strong>'+String(error.message).replace(/[<>&"]/g,'');
}
})();
</script>
</body>
</html>
