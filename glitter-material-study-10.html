<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#e4e3e1">
<title>Glitter Material Study 10 — Spectral Iridescence</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}
body{overflow:hidden;color:#17151a;background:#e4e3e1;font-family:Arial,Helvetica,sans-serif}
#glitter{position:fixed;inset:0;width:100%;height:100%;display:block}
.meta{position:fixed;left:22px;bottom:20px;z-index:2;padding:10px 13px;border:1px solid rgba(30,25,35,.16);border-radius:8px;background:rgba(255,255,255,.34);backdrop-filter:blur(10px);font-size:11px;line-height:1.55;letter-spacing:.035em;color:rgba(20,18,24,.76)}
.meta strong{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#17151a}
.hint{position:fixed;right:22px;bottom:24px;z-index:2;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:rgba(20,18,24,.58)}
@media(max-width:600px){.meta{left:12px;bottom:12px}.hint{right:12px;bottom:16px;font-size:9px}}
</style>
</head>
<body>
<canvas id="glitter" aria-label="Spectral thin-film glitter material with wavelength-integrated iridescence"></canvas>
<div class="meta"><strong>Glitter material · study 10</strong>16-sample visible spectrum · thin-film interference<br>Spectral wavelength integration · angle-dependent iridescence</div>
<div class="hint">Move pointer to shift reflection angle</div>
<script>
(() => {
const canvas=document.getElementById('glitter');
const gl=canvas.getContext('webgl2',{alpha:false,antialias:true,powerPreference:'high-performance'});
if(!gl){document.querySelector('.meta').innerHTML='<strong>WebGL 2 unavailable</strong>This browser or device cannot display the material preview.';return;}
const vertexSource=`#version 300 es
void main(){vec2 p=vec2(float((gl_VertexID<<1)&2),float(gl_VertexID&2));gl_Position=vec4(p*2.0-1.0,0.0,1.0);}`;
const fragmentSource=`#version 300 es
precision highp float;
uniform vec2 uResolution;
uniform vec2 uPointer;
out vec4 outColor;
float hash12(vec2 p){vec3 p3=fract(vec3(p.xyx)*0.1031);p3+=dot(p3,p3.yzx+33.33);return fract((p3.x+p3.y)*p3.z);}
vec2 hash22(vec2 p){float n=hash12(p);return vec2(n,hash12(p+n+17.17));}
// Approximate CIE 1931 colour-matching functions (Wyman et al. Gaussian fits).
float gaussFit(float wavelength,float mean,float leftWidth,float rightWidth){
 float width=(wavelength<mean)?leftWidth:rightWidth;
 float t=(wavelength-mean)*width;
 return exp(-0.5*t*t);
}
vec3 cie1931(float wavelength){
 float x=1.056*gaussFit(wavelength,599.8,0.0264,0.0323)
       +0.362*gaussFit(wavelength,442.0,0.0624,0.0374)
       -0.065*gaussFit(wavelength,501.1,0.0490,0.0382);
 float y=0.821*gaussFit(wavelength,568.8,0.0213,0.0247)
       +0.286*gaussFit(wavelength,530.9,0.0613,0.0322);
 float z=1.217*gaussFit(wavelength,437.0,0.0845,0.0278)
       +0.681*gaussFit(wavelength,459.0,0.0385,0.0725);
 return max(vec3(x,y,z),vec3(0.0));
}
vec3 thinFilm(float cosTheta,float thicknessNm,float phaseOffset){
 vec3 xyz=vec3(0.0);
 vec3 whiteXYZ=vec3(0.0);
 for(int i=0;i<16;i++){
  float wavelength=400.0+float(i)*20.0;
  float phase=6.2831853*(2.0*1.38*thicknessNm*cosTheta/wavelength)+phaseOffset;
  float reflectance=0.5+0.5*cos(phase);
  vec3 matching=cie1931(wavelength);
  xyz+=matching*reflectance;
  whiteXYZ+=matching;
 }
 xyz/=max(whiteXYZ.y,0.0001);
 // CIE XYZ to linear sRGB.
 vec3 rgb=vec3(
  3.2406*xyz.x-1.5372*xyz.y-0.4986*xyz.z,
 -0.9689*xyz.x+1.8758*xyz.y+0.0415*xyz.z,
  0.0557*xyz.x-0.2040*xyz.y+1.0570*xyz.z
 );
 rgb=max(rgb,vec3(0.0));
 return rgb/(1.0+max(max(rgb.r,rgb.g),rgb.b));
}
vec3 facetLayer(vec2 pixel,float cellSize,float seed,float density,vec3 L,vec3 H){
 vec2 cell=floor(pixel/cellSize);vec2 local=fract(pixel/cellSize);vec2 rnd=hash22(cell+seed);
 vec2 center=0.16+0.68*rnd;float angle=hash12(cell+seed+5.3)*6.2831853;
 mat2 rot=mat2(cos(angle),-sin(angle),sin(angle),cos(angle));vec2 q=rot*(local-center);
 float aspect=mix(0.42,0.92,hash12(cell+seed+8.1));float radius=mix(0.22,0.39,hash12(cell+seed+11.7));
 float shape=length(vec2(q.x,q.y/aspect));float edge=1.0-smoothstep(radius-0.055,radius+0.025,shape);
 float mask=edge*step(1.0-density,hash12(cell+seed+13.9));
 float xi=clamp(hash12(cell+seed+19.1),0.015,0.985);
 float alpha=mix(0.20,0.52,hash12(cell+seed+23.4));
 float tanTheta=alpha*sqrt(xi/(1.0-xi));float azimuth=hash12(cell+seed+29.8)*6.2831853;
 vec3 N=normalize(vec3(tanTheta*cos(azimuth),tanTheta*sin(azimuth),1.0));
 float ndh=max(dot(N,H),0.0);float alignment=pow(ndh,mix(90.0,230.0,hash12(cell+seed+31.2)));
 float glint=mask*alignment;float broad=mask*pow(ndh,24.0)*0.12;
 float thickness=mix(260.0,720.0,hash12(cell+seed+37.6));
 vec3 film=thinFilm(clamp(dot(N,L),0.08,1.0),thickness,hash12(cell+seed+41.0)*1.4);
 vec3 reflected=mix(vec3(0.88,0.91,0.96),film,0.74);
 vec3 sparkle=reflected*(glint*2.8+broad*0.8);
 sparkle+=vec3(1.0,0.985,0.97)*pow(ndh,320.0)*mask*1.3;
 return sparkle;
}
void main(){
 vec2 pixel=gl_FragCoord.xy;vec2 pointer=uPointer/uResolution;
 vec3 L=normalize(vec3((pointer.x-0.5)*0.9,(0.5-pointer.y)*0.72,0.94));
 vec3 H=normalize(L+vec3(0.0,0.0,1.0));
 float globalAngle=clamp(L.z,0.0,1.0);
 vec3 baseFilm=thinFilm(globalAngle,470.0,0.0);
 vec3 base=mix(vec3(0.78,0.80,0.84),baseFilm,0.13);
 vec3 fine=facetLayer(pixel,2.25,4.0,0.92,L,H);
 vec3 medium=facetLayer(pixel,4.8,91.0,0.54,L,H);
 vec3 micro=facetLayer(pixel,1.18,217.0,0.68,L,H)*0.48;
 vec3 color=base+fine+medium+micro;
 outColor=vec4(clamp(color,0.0,1.0),1.0);
}`;
function compile(type,source){const shader=gl.createShader(type);gl.shaderSource(shader,source);gl.compileShader(shader);if(!gl.getShaderParameter(shader,gl.COMPILE_STATUS)){const message=gl.getShaderInfoLog(shader);gl.deleteShader(shader);throw new Error(message);}return shader;}
try{
 const program=gl.createProgram();gl.attachShader(program,compile(gl.VERTEX_SHADER,vertexSource));gl.attachShader(program,compile(gl.FRAGMENT_SHADER,fragmentSource));gl.linkProgram(program);
 if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(program));
 gl.useProgram(program);const resolutionLoc=gl.getUniformLocation(program,'uResolution');const pointerLoc=gl.getUniformLocation(program,'uPointer');
 let pointer=[innerWidth*0.5,innerHeight*0.5];
 function resize(){const dpr=Math.min(devicePixelRatio||1,1.5);const width=Math.max(1,Math.floor(innerWidth*dpr));const height=Math.max(1,Math.floor(innerHeight*dpr));if(canvas.width!==width||canvas.height!==height){canvas.width=width;canvas.height=height;gl.viewport(0,0,width,height);}}
 addEventListener('resize',resize);addEventListener('pointermove',event=>{pointer=[event.clientX,innerHeight-event.clientY];},{passive:true});resize();
 function draw(){resize();gl.uniform2f(resolutionLoc,canvas.width,canvas.height);gl.uniform2f(pointerLoc,pointer[0]*canvas.width/innerWidth,pointer[1]*canvas.height/innerHeight);gl.drawArrays(gl.TRIANGLES,0,3);requestAnimationFrame(draw);}
 requestAnimationFrame(draw);
}catch(error){document.querySelector('.meta').innerHTML='<strong>Material preview could not start</strong>'+String(error.message).replace(/[<>&"]/g,'');}
})();
</script>
</body>
</html>
