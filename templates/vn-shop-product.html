<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title><meta name="description" content="{{META_DESCRIPTION}}">
<meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1"><meta name="author" content="VN SHOP — VNION RECORDS">
<link rel="canonical" href="{{CANONICAL}}">{{HREFLANG}}
<link rel="icon" type="image/png" href="../../images/vn-logo-official.png">
<meta property="og:type" content="product"><meta property="og:site_name" content="VN SHOP"><meta property="og:title" content="{{TITLE}}"><meta property="og:description" content="{{META_DESCRIPTION}}"><meta property="og:url" content="{{CANONICAL}}"><meta property="og:image" content="{{IMAGE_URL}}"><meta property="og:image:alt" content="{{IMAGE_ALT}}">
<meta property="product:price:amount" content="{{PRICE}}"><meta property="product:price:currency" content="{{CURRENCY}}">
<meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="{{TITLE}}"><meta name="twitter:description" content="{{META_DESCRIPTION}}"><meta name="twitter:image" content="{{IMAGE_URL}}"><meta name="twitter:image:alt" content="{{IMAGE_ALT}}">
<script type="application/ld+json">{{SCHEMA}}</script>
<link rel="stylesheet" href="../../merch.css"><link rel="stylesheet" href="../../product-page.css">
</head>
<body class="vn-product-page-body">
<header class="header"><a class="projects-logo" href="../../index.html" aria-label="OJEE home">OJEE<span>®</span></a><a class="header-vn-logo" href="../../merch.html" aria-label="VN SHOP"><img src="../../images/vn-logo-black-transparent.png" alt="VN"></a><div class="header-actions"><a class="icon-button" href="../../merch.html#cart" aria-label="Shopping cart"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.2 11.1a2 2 0 0 0 2 1.6h7.9a2 2 0 0 0 2-1.6L21 8H6"/><circle cx="10" cy="20" r="1"/><circle cx="18" cy="20" r="1"/></svg></a></div></header>
<main class="product-page-main">
<nav class="detail-breadcrumb" aria-label="Breadcrumb">{{BREADCRUMBS}}</nav>
<div class="detail-layout"><div class="detail-gallery">{{THUMBNAILS}}<div class="detail-image-stage"><div class="detail-main-image"><img id="product-main-image" src="../../{{IMAGE_PATH}}" alt="{{IMAGE_ALT}}" fetchpriority="high" decoding="async"></div></div></div>
<section class="detail-info"><h1 class="detail-name">{{NAME}}</h1><div class="detail-price">{{PRICE_DISPLAY}}</div>{{VARIANT_FIELD}}
<div class="detail-field"><label class="detail-field-label" for="product-quantity">QUANTITY</label><div class="product-page-quantity"><button type="button" data-quantity="-1" aria-label="Decrease quantity">−</button><input id="product-quantity" type="number" min="1" max="99" value="1"><button type="button" data-quantity="1" aria-label="Increase quantity">+</button></div></div>
<button class="primary-button full-button product-page-add" id="product-add" type="button">ADD TO CART</button><p class="product-page-feedback" id="product-feedback" role="status" aria-live="polite"></p>
<p class="detail-description">{{DESCRIPTION}}</p><p class="detail-note">{{PRODUCT_TYPE}}</p></section></div>{{RELATED}}
</main>
<footer class="footer"><nav class="footer-links" aria-label="Help and legal"><a href="../../help.html">HELP &amp; SUPPORT</a><a href="../../policies/terms-of-use.html">TERMS</a><a href="../../policies/privacy-policy.html">PRIVACY</a><a href="../../merch.html">VN SHOP</a></nav><div class="copyright">{{COPYRIGHT}}</div><img class="footer-sublogo" src="../../images/vn-logo-black-transparent.png" alt="VN" width="180" height="116" loading="lazy" decoding="async"></footer>
<script type="application/json" id="product-data">{{PRODUCT_JSON}}</script>
<script>
(()=>{const p=JSON.parse(document.getElementById("product-data").textContent),max=99,qty=document.getElementById("product-quantity"),feedback=document.getElementById("product-feedback");document.querySelectorAll("[data-quantity]").forEach(b=>b.addEventListener("click",()=>qty.value=Math.max(1,Math.min(max,(Number(qty.value)||1)+Number(b.dataset.quantity)))));document.querySelectorAll("[data-gallery-image]").forEach(b=>b.addEventListener("click",()=>{const src=(p.images&&p.images.length?p.images:[p.image])[Number(b.dataset.galleryImage)];document.getElementById("product-main-image").src="../../"+src;document.querySelectorAll("[data-gallery-image]").forEach(x=>{const a=x===b;x.classList.toggle("is-active",a);x.setAttribute("aria-pressed",String(a));});}));document.getElementById("product-add").addEventListener("click",()=>{const variant=document.getElementById("product-variant")?.value||"",hasOptions={{HAS_OPTIONS}};if(hasOptions&&!variant){feedback.textContent="Please select an option.";return;}let cart=[];try{cart=JSON.parse(localStorage.getItem("vn-shop-cart")||"[]");if(!Array.isArray(cart))cart=[];}catch(_){cart=[];}const quantity=Math.max(1,Math.min(max,Number(qty.value)||1)),key=String(p.id||p.name)+"::"+variant,existing=cart.find(x=>x.key===key);if(existing)existing.quantity=Math.min(max,Number(existing.quantity||0)+quantity);else cart.push({key,product:p,variant,quantity});try{localStorage.setItem("vn-shop-cart",JSON.stringify(cart));}catch(_){feedback.textContent="Your browser could not save the cart.";return;}window.location.href="../../merch.html#cart";});})();
</script></body></html>
