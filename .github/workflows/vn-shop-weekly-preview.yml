name: Refresh VN SHOP preview

on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vn-shop-weekly-preview
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Capture VN SHOP homepage
        run: |
          mkdir -p images
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            try {
              const page = await browser.newPage({
                viewport: { width: 1440, height: 1000 },
                deviceScaleFactor: 1
              });
              const response = await page.goto('https://ojee9.github.io/merch.html', {
                waitUntil: 'domcontentloaded',
                timeout: 60000
              });
              if (!response || !response.ok()) {
                throw new Error('VN SHOP returned an unsuccessful response: ' + (response && response.status()));
              }
              await page.locator('body').waitFor({ state: 'visible', timeout: 15000 });
              await page.waitForTimeout(7000);
              await page.screenshot({
                path: 'images/vn-shop-weekly.png',
                type: 'png',
                fullPage: false,
                animations: 'disabled'
              });
            } finally {
              await browser.close();
            }
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Publish updated preview
        run: |
          if git diff --quiet -- images/vn-shop-weekly.png; then
            echo "Screenshot is unchanged; no commit needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/vn-shop-weekly.png
          git commit -m "Refresh weekly VN SHOP homepage preview"
          git push
