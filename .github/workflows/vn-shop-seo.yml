name: VN SHOP SEO pages and sitemap

on:
  push:
    branches: [main]
    paths:
      - "merch.json"
      - "scripts/vn-shop-seo-build.mjs"
      - "templates/**"
      - ".github/workflows/vn-shop-seo.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-seo-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Generate product pages, collection pages and sitemap
        run: node scripts/vn-shop-seo-build.mjs
      - name: Commit generated pages
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add products collections sitemap.xml
            git commit -m "Build VN SHOP product SEO pages and sitemap"
            git push
          else
            echo "SEO pages and sitemap are already up to date."
          fi
