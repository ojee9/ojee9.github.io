
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">
  <meta name="description" content="Discover VN Club Magazine 01, featuring Ojee Ka$h’s official Q&A with Exposed Vocals, GTA LOVE, 9OJEEZ9, Southside, VN STUDIOS, his relationship with Ankara, and his creative process behind the music.">
  <title>VN Club MAGAZINE 01 — Projects — OJEE</title>
  <link rel="stylesheet" href="projects.css">
  <style>
    .event-card:has(img[src*="event-ojee-kash-gta-love-qa-2314-poster"]) .event-image {
      object-fit: contain;
      background: #080808;
    }

    .magazine-pullquote {
      margin: 28px 0;
      padding: 8px 0 8px 22px;
      border-left: 2px solid var(--accent, #d8ff00);
      color: #f2f2f2;
      font-size: clamp(19px, 2.6vw, 27px);
      font-weight: 700;
      line-height: 1.35;
      letter-spacing: -0.035em;
    }

    .magazine-pullquote cite {
      display: block;
      margin-top: 12px;
      color: #888;
      font-size: 9px;
      font-style: normal;
      font-weight: 700;
      line-height: 1.6;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <header class="projects-header">
    <a class="projects-logo" href="index.html">OJEE<span>®</span></a>
    <a class="back-link" href="space.html">← BACK</a>
  </header>

  <main class="projects-page">
    <nav class="projects-nav" aria-label="Content categories">
      <a href="#news" data-category="news">NEWS</a>
      <a href="#events" data-category="events">EVENTS</a>
      <a href="#projects" data-category="projects">PROJECTS</a>
      <a href="#merch" data-category="merch">MERCH</a>
    </nav>

    <div class="projects-layout">
      <section class="projects-content" aria-live="polite">
        <div class="section-heading">
          <span class="eyebrow">OJEE ARCHIVE / 001</span>
          <h1 id="content-title">PROJECTS</h1>
          <p id="content-description">Selected work, ongoing ideas and releases.</p>
        </div>

        <div class="content-status" id="content-status">
          <span class="status-dot"></span>
          <span id="result-count">0 ENTRIES</span>
        </div>

        <div class="projects-grid" id="projects-grid">
          <div class="empty-state">
            <span class="empty-mark">＋</span>
            <p>NO ENTRIES YET</p>
            <span>CONTENT WILL BE ARCHIVED HERE.</span>
          </div>
        </div>
      </section>

      <aside class="filter-panel" aria-label="Search and filters">
        <div class="panel-heading">
          <span class="eyebrow">INDEX / FILTERS</span>
          <span class="panel-number">01—04</span>
        </div>

        <form id="search-form" class="search-form" role="search">
          <label for="content-search">SEARCH ARCHIVE</label>
          <div class="search-field">
            <input
              id="content-search"
              type="search"
              placeholder="Search entries..."
              autocomplete="off"
            >
            <button type="submit" aria-label="Search">↗</button>
          </div>
        </form>

        <div class="filter-group" id="event-filters" hidden>
          <h2>EVENT STATUS</h2>
          <label class="filter-option">
            <input type="checkbox" name="event-status" value="past">
            <span>Past Events</span>
          </label>
          <label class="filter-option">
            <input type="checkbox" name="event-status" value="present">
            <span>Upcoming Events</span>
          </label>
        </div>

        <div class="filter-group" id="merch-filters" hidden>
          <h2>COLLECTION</h2>
          <label class="filter-option">
            <input type="checkbox" name="collection" value="vn-legacy">
            <span>VN LEGACY COLLECTION</span>
          </label>
        </div>

        <div class="filter-group" id="year-filters">
          <h2>YEAR</h2>
          <div class="filter-options" id="year-options">
            <span class="filter-note">YEARS WILL APPEAR WITH ENTRIES.</span>
          </div>
        </div>

        <div class="filter-group">
          <h2>SORT BY</h2>
          <label class="sort-option">
            <input type="radio" name="sort" value="newest" checked>
            <span>Newest</span>
            <span class="sort-indicator"></span>
          </label>
          <label class="sort-option">
            <input type="radio" name="sort" value="hottest">
            <span>Hottest</span>
            <span class="sort-indicator"></span>
          </label>
          <label class="sort-option">
            <input type="radio" name="sort" value="all-time">
            <span>Top All Time</span>
            <span class="sort-indicator"></span>
          </label>
        </div>

        <button type="button" id="reset-filters" class="reset-filters">
          RESET FILTERS <span>↺</span>
        </button>

        <div class="panel-footer">
          <span>INDEPENDENT ARCHIVE</span>
          <span>© OJEE</span>
        </div>
      </aside>
    </div>
  </main>

  <script>
    (() => {
      const categories = {
        news: {
          title: "NEWS",
          description: "Updates, announcements and archive notes."
        },
        events: {
          title: "EVENTS",
          description: "Past appearances and upcoming events."
        },
        projects: {
          title: "PROJECTS",
          description: "Selected work, ongoing ideas and releases."
        },
        merch: {
          title: "MERCH",
          description: "Collections, objects and limited editions."
        }
      };

      // EXISTING EVENT RECORDS — PRESERVED
      const events = [
        {
          id: "flinta-halloween-2026",
          title: "FLINTA HALLOWEEN PARTY NIGHT",
          subtitle: "SHOW YOUR INNER MONSTER",
          artist: "9ojeez9",
          date: "2026-10-31",
          dateLabel: "31 OCT 2026",
          time: "19:00–00:00",
          setTime: "21:00–23:00",
          venue: "FLINTA Cocktail Bar & Rooftop",
          address: "Şair Eşref Paşa Sokak No:4, Bereketzade, Beyoğlu, Istanbul",
          image: "assets/visuals/FLINTA-9ojeez9-showyourmonster-YATAY.png",
          ticketUrl: "https://biletino.com/en/e-1do8/flinta-halloween-party/#",
          tags: "Halloween, 18+, Show Your Inner Monster",
          status: "present",
          descriptionEN: "Unleash your inner monster at FLINTA for a Halloween night of cocktails, music, immersive decorations and rooftop nightlife. Inspired by Show Your Inner Monster, the evening invites guests to embrace the darker side of Halloween through creative costumes, atmospheric visuals and a night made for dancing. 9ojeez9 joins the lineup for a dedicated two-hour set, from 21:00 to 23:00. The night also features a special pole dance performance.",
          descriptionTR: "FLINTA’da kokteyller, müzik, etkileyici dekorasyonlar ve rooftop atmosferiyle bir Halloween gecesine hazır ol. Show Your Inner Monster temasından ilham alan etkinlik, yaratıcı kostümlerle Halloween’in karanlık tarafını keşfetmeye ve gece boyunca dans etmeye davet ediyor. 9ojeez9, gecenin müzik programında 21:00–23:00 saatleri arasında iki saatlik özel bir set ile yer alıyor. Etkinlikte ayrıca özel bir pole dance performansı bulunuyor."
        },
        {
          id: "gta-love-launch-2026",
          title: "GTA LOVE",
          subtitle: "PRIVATE LAUNCH NIGHT",
          artist: "Ojee Ka$h",
          date: "2026-10-02",
          dateLabel: "02 OCT 2026",
          time: "18:00–00:00",
          setTime: "Live set: 19:30",
          venue: "Flinta Cocktail Bar & Rooftop — Walton Hotels Galata Roof",
          address: "Bereketzade, Şair Eşref Paşa Sokak No:4, Beyoğlu, Istanbul",
          image: "assets/visuals/past-event-ojee-kash-gta-love-launch.png",
          ticketUrl: "https://biletino.com/en/e-1ddm/ojee-kah-gta-love-premium-launch-night/#",
          tags: "18+, Limited Access, ₺2,500",
          status: "past",
          descriptionEN: "A private launch night celebrating Ojee Ka$h’s GTA LOVE at Flinta Cocktail Bar & Rooftop. Designed for a limited number of guests, this exclusive gathering offers a more intimate alternative to a traditional concert. Limited access. One night, one special release.",
          descriptionTR: "Ojee Ka$h’ın GTA LOVE lansmanı için Flinta Cocktail Bar & Rooftop’ta özel bir gece. Geleneksel konser formatından farklı olarak sınırlı sayıda katılımcıyla gerçekleşen bu buluşma, daha samimi ve ayrıcalıklı bir deneyim sunuyor. Sınırlı erişim. Tek gece, özel bir lansman."
        },
        {
          id: "cheater-launch-2023",
          title: "CHEATER",
          subtitle: "ALBUM LAUNCH",
          artist: "9ojeez9",
          date: "2023-09-16",
          dateLabel: "16 SEP 2023",
          time: "21:00–01:00",
          venue: "Cute",
          address: "Bestekar Sokak, Kavaklıdere, Çankaya, Ankara",
          image: "assets/visuals/past-event-9ojeez9-chtr-launch.png",
          ticketUrl: "https://biletino.com/tr/e-q8d/cheater-album-lunch/#",
          tags: "Album Premiere, Electronic, Groove, Dark Melodic",
          status: "past",
          descriptionEN: "CHEATER is a genre-spanning album journey from Trap to PsyTrance. Celebrating its premiere at Cute, 9ojeez9 brings the project to Ankara for a night of music, followed by Electronic, Groove and Dark Melodic sounds until late. One rule: stay with the music.",
          descriptionTR: "CHEATER, Trap’ten PsyTrance’a uzanan, farklı türleri bir araya getiren bir albüm yolculuğu. 9ojeez9, projenin prömiyerini Ankara’daki Cute’ta kutluyor. Albüm lansmanının ardından gece, Electronic, Groove ve Dark Melodic sesleriyle devam ediyor. Tek kural: müzikle kal."
        }
      ];

      // ONE SHARED ANNOUNCEMENT RECORD FOR NEWS, PROJECTS AND MERCH
      const archiveEntries = [
        {
          id: "vn-club-magazine-01",
          title: "VN Club MAGAZINE 01",
          subtitle: "VN Club MAGAZINE",
          artist: "VN Club",
          image: "assets/visuals/event-ojee-kash-gta-love-qa-2314-poster.png",
          tags: "VN Club MAGAZINE 01, Exposed Vocals, GTA LOVE, Ojee Ka$h, 9OJEEZ9, Southside, VN STUDIOS, Ankara, Interview",
          collections: [],
          categories: ["news", "projects"],
          descriptionEN: [
            "PULLQUOTE: GTA or LOVE, these aren't different cuts. — Ojee Ka$h",
            "VN Club MAGAZINE 01 is here.",
            "The very first edition of VN Club Magazine features Ojee Ka$h in an exclusive Q&A with Exposed Vocals, covering the making of GTA LOVE and the meaning behind it.",
            "PULLQUOTE: The one or two things I value most in my life right here... — Ojee Ka$h",
            "He also shares insights about his personal journey, upcoming music, and untold stories behind his creative process, including details you may not have heard before.",
            "Follow this page for the latest updates.",
            "More details coming soon."
          ],
          descriptionTR: [
            "VN Club MAGAZINE 01 yayında.",
            "VN Club’un ilk sayısında Ojee Ka$h bizlerle!",
            "Exposed Vocals ile özel olarak gerçekleşen soru-cevap röportajında Ojee Ka$h; GTA LOVE’ın yapım sürecinden bahsediyor. Ayrıca Ojee Ka$h kişisel yolculuğuna, gelecek çalışmalarına ve yaratıcı sürecinin ardındaki henüz anlatılmamış hikayelere ışık tutuyor.",
            "Belki de daha önce hiç duymadığınız detayları içeren bu röportajın yeni gelişmelerini ve yayın güncellemelerini buradan takip edebilirsiniz.",
            "Daha fazla detay yakında sizlerle."
          ],
          details: [
            ["INTERVIEW BY", "Exposed Vocals"],
            ["FEATURED PROJECT", "GTA LOVE"],
            ["COLLECTION", "VN Club MAGAZINE 01"],
            ["FEATURED ARTIST", "Ojee Ka$h"],
            ["STATUS", "AVAILABLE SOON"]
          ]
        },
        {
          id: "vn-legacy-collection",
          title: "VN: LEGACY COLLECTION — AVAILABLE SOON!",
          subtitle: "VN LEGACY COLLECTION",
          artist: "VN Studios",
          image: "assets/visuals/vn-legacy-collection-poster.png",
          tags: "VN Legacy Collection, Merch, Announcement",
          collections: ["vn-legacy"],
          categories: ["news", "projects", "merch"],
          descriptionEN: [
            "Otherly grey'd onto golden sunshine...",
            "VN Studios just planning to drop a brand new merch line representing different phases. Nothing new, only the essentials left as a Legacy Collection. In due time...",
            "Check out VN's freshest pics one by one, only on VN Legacy Collection. Stay tuned & wait for further announcements."
          ]
        }
      ];

      const navLinks = [...document.querySelectorAll("[data-category]")];
      const title = document.getElementById("content-title");
      const description = document.getElementById("content-description");
      const eventFilters = document.getElementById("event-filters");
      const merchFilters = document.getElementById("merch-filters");
      const yearFilters = document.getElementById("year-filters");
      const searchForm = document.getElementById("search-form");
      const searchInput = document.getElementById("content-search");
      const resetButton = document.getElementById("reset-filters");
      const grid = document.getElementById("projects-grid");
      const resultCount = document.getElementById("result-count");
      const yearOptions = document.getElementById("year-options");

      let activeCategory = "projects";

      function populateYears() {
        const years = [...new Set(
          events.map(event => event.date.slice(0, 4))
        )].sort((a, b) => b.localeCompare(a));

        yearOptions.innerHTML = years.map(year => `
          <label class="filter-option">
            <input type="checkbox" name="year" value="${year}">
            <span>${year}</span>
          </label>
        `).join("");
      }

      function getSort() {
        return document.querySelector(
          'input[name="sort"]:checked'
        )?.value || "newest";
      }

      function getFilteredEvents() {
        const query = searchInput.value.trim().toLowerCase();

        const selectedStatuses = [
          ...document.querySelectorAll(
            'input[name="event-status"]:checked'
          )
        ].map(input => input.value);

        const selectedYears = [
          ...document.querySelectorAll('input[name="year"]:checked')
        ].map(input => input.value);

        let filtered = events.filter(event => {
          const searchable = [
            event.title,
            event.subtitle,
            event.artist,
            event.venue,
            event.address,
            event.descriptionEN,
            event.descriptionTR,
            event.tags,
            event.dateLabel
          ].join(" ").toLowerCase();

          const matchesQuery = !query || searchable.includes(query);
          const matchesStatus = selectedStatuses.length === 0 ||
            selectedStatuses.includes(event.status);
          const matchesYear = selectedYears.length === 0 ||
            selectedYears.includes(event.date.slice(0, 4));

          return matchesQuery && matchesStatus && matchesYear;
        });

        if (getSort() === "all-time") {
          filtered.sort((a, b) => a.date.localeCompare(b.date));
        } else {
          filtered.sort((a, b) => b.date.localeCompare(a.date));
        }

        return filtered;
      }

      function getFilteredArchiveEntries() {
        const query = searchInput.value.trim().toLowerCase();

        const selectedCollections = [
          ...document.querySelectorAll(
            'input[name="collection"]:checked'
          )
        ].map(input => input.value);

        let filtered = archiveEntries.filter(entry => {
          const belongsToCategory =
            entry.categories.includes(activeCategory);

          const searchable = [
            entry.title,
            entry.subtitle,
            entry.artist,
            entry.tags,
            ...entry.descriptionEN,
            ...entry.collections
          ].join(" ").toLowerCase();

          const matchesQuery = !query || searchable.includes(query);

          const matchesCollection =
            activeCategory !== "merch" ||
            selectedCollections.length === 0 ||
            selectedCollections.some(collection =>
              entry.collections.includes(collection)
            );

          return belongsToCategory &&
            matchesQuery &&
            matchesCollection;
        });

        if (getSort() === "all-time") {
          filtered = [...filtered].reverse();
        }

        return filtered;
      }

      function renderEvents() {
        const filtered = getFilteredEvents();

        resultCount.textContent =
          `${filtered.length} ${filtered.length === 1 ? "ENTRY" : "ENTRIES"}`;

        if (!filtered.length) {
          renderNoResults("NO MATCHING EVENTS");
          return;
        }

        grid.innerHTML = filtered.map(event => `
          <article class="event-card">
            <a class="event-image-link"
               href="${event.ticketUrl}"
               target="_blank"
               rel="noopener noreferrer"
               aria-label="Open ${event.title} event page">
              <img
                class="event-image"
                src="${event.image}"
                alt="${event.title}"
                loading="lazy"
              >
            </a>

            <div class="event-card-content">
              <div class="event-meta">
                <span>${event.dateLabel}</span>
                <span>${event.status === "present" ? "UPCOMING" : "ARCHIVE"}</span>
              </div>

              <p class="event-artist">${event.artist}</p>
              <h2 class="event-title">${event.title}</h2>
              <p class="event-subtitle">${event.subtitle}</p>

              <div class="event-description">
                <p>${event.descriptionEN}</p>
                <p>${event.descriptionTR}</p>
              </div>

              <div class="event-details">
                <p><span>VENUE</span>${event.venue}</p>
                <p><span>LOCATION</span>${event.address}</p>
                <p><span>TIME</span>${event.time}</p>
                ${event.setTime ? `<p><span>SET / PROGRAM</span>${event.setTime}</p>` : ""}
                <p><span>INFO</span>${event.tags}</p>
              </div>

              <a class="event-ticket-link"
                 href="${event.ticketUrl}"
                 target="_blank"
                 rel="noopener noreferrer">
                EVENT DETAILS <span>↗</span>
              </a>
            </div>
          </article>
        `).join("");
      }

      function renderArchiveEntries() {
        const filtered = getFilteredArchiveEntries();

        resultCount.textContent =
          `${filtered.length} ${filtered.length === 1 ? "ENTRY" : "ENTRIES"}`;

        if (!filtered.length) {
          renderNoResults("NO MATCHING ENTRIES");
          return;
        }

        grid.innerHTML = filtered.map(entry => `
          <article class="event-card" data-entry-id="${entry.id}">
            <div class="event-image-link">
              <img
                class="event-image"
                src="${entry.image}"
                alt="${entry.title}"
                loading="lazy"
              >
            </div>

            <div class="event-card-content">
              <div class="event-meta">
                <span>${entry.id === "vn-club-magazine-01" ? "Club 01" : "VN STUDIOS"}</span>
                <span>AVAILABLE SOON</span>
              </div>

              <p class="event-artist">${entry.artist}</p>
              <h2 class="event-title">${entry.title}</h2>
              <p class="event-subtitle">${entry.subtitle}</p>

              <div class="event-description">
                ${entry.descriptionEN.map(paragraph => {
                  if (paragraph.startsWith("PULLQUOTE: ")) {
                    const quote = paragraph.slice("PULLQUOTE: ".length);
                    const separator = quote.lastIndexOf(" — ");
                    const text = separator >= 0 ? quote.slice(0, separator) : quote;
                    const attribution = separator >= 0 ? quote.slice(separator + 3) : "";
                    return `<blockquote class="magazine-pullquote">“${text}”${attribution ? `<cite>— ${attribution}</cite>` : ""}</blockquote>`;
                  }
                  return `<p>${paragraph}</p>`;
                }).join("")}
                ${entry.descriptionTR ? entry.descriptionTR.map(paragraph =>
                  `<p lang="tr">${paragraph}</p>`
                ).join("") : ""}
              </div>

              <div class="event-details">
                ${(entry.details || [["COLLECTION", "VN LEGACY COLLECTION"], ["STATUS", "AVAILABLE SOON"]]).map(([label, value]) =>
                  `<p><span>${label}</span>${value}</p>`
                ).join("")}
              </div>
            </div>
          </article>
        `).join("");
      }

      function renderNoResults(message = "NO ENTRIES YET") {
        resultCount.textContent = "0 ENTRIES";

        grid.innerHTML = `
          <div class="empty-state">
            <span class="empty-mark">＋</span>
            <p>${message}</p>
            <span>TRY ANOTHER SEARCH OR FILTER.</span>
          </div>
        `;
      }

      function setCategory(category) {
        if (!categories[category]) return;

        activeCategory = category;
        title.textContent = categories[category].title;
        description.textContent = categories[category].description;

        navLinks.forEach(link => {
          const active = link.dataset.category === category;
          link.classList.toggle("active", active);

          if (active) {
            link.setAttribute("aria-current", "page");
          } else {
            link.removeAttribute("aria-current");
          }
        });

        eventFilters.hidden = category !== "events";
        merchFilters.hidden = category !== "merch";
        yearFilters.hidden = category !== "events";

        if (category === "events") {
          renderEvents();
        } else {
          renderArchiveEntries();
        }
      }

      navLinks.forEach(link => {
        link.addEventListener("click", event => {
          event.preventDefault();

          const category = link.dataset.category;
          setCategory(category);
          history.replaceState(null, "", "#" + category);
        });
      });

      searchForm.addEventListener("submit", event => {
        event.preventDefault();

        if (activeCategory === "events") {
          renderEvents();
        } else {
          renderArchiveEntries();
        }
      });

      searchInput.addEventListener("input", () => {
        if (activeCategory === "events") {
          renderEvents();
        } else {
          renderArchiveEntries();
        }
      });

      document.addEventListener("change", event => {
        if (activeCategory === "events" && event.target.matches(
          'input[name="event-status"], input[name="year"], input[name="sort"]'
        )) {
          renderEvents();
        }

        if (activeCategory === "merch" && event.target.matches(
          'input[name="collection"], input[name="sort"]'
        )) {
          renderArchiveEntries();
        }

        if (
          activeCategory !== "events" &&
          activeCategory !== "merch" &&
          event.target.matches('input[name="sort"]')
        ) {
          renderArchiveEntries();
        }
      });

      resetButton.addEventListener("click", () => {
        searchInput.value = "";

        document.querySelectorAll(
          'input[name="event-status"], input[name="collection"], input[name="year"]'
        ).forEach(input => {
          input.checked = false;
        });

        document.querySelector(
          'input[name="sort"][value="newest"]'
        ).checked = true;

        if (activeCategory === "events") {
          renderEvents();
        } else {
          renderArchiveEntries();
        }
      });

      populateYears();

      const initialCategory = location.hash.slice(1);
      setCategory(
        categories[initialCategory] ? initialCategory : "projects"
      );
    })();
  </script>
</body>
</html>
