
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Explore official VN RECORDS merchandise, clothing and products.">
<meta name="theme-color" content="#C6BBA7">
<title>VN SHOP® — 9ojeez9</title>
<link rel="stylesheet" href="merch.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<header class="header">
  <a class="projects-logo" href="index.html" aria-label="OJEE home">
    OJEE<span>®</span>
  </a>

  <div class="header-vn-logo" role="img" aria-label="VN">
    <img src="images/vn-logo-black-transparent.png" alt="">
  </div>

  <div class="header-actions">
    <button class="icon-button" id="cart-open" type="button" aria-label="Shopping cart">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 4h2l2.2 11.1a2 2 0 0 0 2 1.6h7.9a2 2 0 0 0 2-1.6L21 8H6"/>
        <circle cx="10" cy="20" r="1"/>
        <circle cx="18" cy="20" r="1"/>
      </svg>
      <span id="cart-count">0</span>
    </button>

    <button class="icon-button" id="profile-open" type="button" aria-label="Account">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="8" r="4"/>
        <path d="M4 21v-2a8 8 0 0 1 16 0v2"/>
      </svg>
    </button>
  </div>
</header>

<nav class="catalog-bar" aria-label="Product categories">
  <label for="category-select" hidden>Category</label>
  <select class="category-select" id="category-select"></select>

  <button
    class="icon-button search-toggle"
    id="search-toggle"
    type="button"
    aria-expanded="false"
    aria-controls="search-panel"
    aria-label="Search"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="10.8" cy="10.8" r="6.8"/>
      <path d="m16 16 4.5 4.5"/>
    </svg>
  </button>
</nav>

<section class="search-panel" id="search-panel" hidden>
  <form class="search-form" id="search-form" role="search">
    <input
      class="search-input"
      id="search-input"
      type="search"
      autocomplete="off"
      placeholder="Search products"
      aria-label="Search products"
    >
    <button class="search-close" id="search-close" type="button" aria-label="Close search">×</button>
  </form>
</section>

<main>
  <section class="products" aria-live="polite">
    <div class="product-grid" id="product-grid"></div>
    <div class="empty" id="empty-message" hidden></div>
  </section>
</main>

<footer class="footer">
  <nav class="footer-links" id="footer-links" aria-label="Help and legal"></nav>
  <div class="copyright" id="copyright"></div>
</footer>

<!-- PRODUCT DETAILS -->
<div class="drawer-overlay" id="detail-overlay" aria-hidden="true" hidden>
  <section class="drawer" role="dialog" aria-modal="true" aria-labelledby="detail-drawer-title">
    <header class="drawer-head">
      <h2 class="drawer-title" id="detail-drawer-title">PRODUCT DETAILS</h2>
      <button class="drawer-close" id="detail-close" type="button" aria-label="Close">×</button>
    </header>
    <div class="drawer-content" id="detail-content"></div>
  </section>
</div>

<!-- CART -->
<div class="drawer-overlay" id="cart-overlay" aria-hidden="true" hidden>
  <section class="drawer" role="dialog" aria-modal="true" aria-labelledby="cart-drawer-title">
    <header class="drawer-head">
      <h2 class="drawer-title" id="cart-drawer-title">YOUR CART</h2>
      <button class="drawer-close" id="cart-close" type="button" aria-label="Close">×</button>
    </header>
    <div class="drawer-content" id="cart-content"></div>
  </section>
</div>

<div id="merch-config-ui"></div>

<script src="account.js"></script>
<script src="checkout.js"></script>

<script>
"use strict";

(async () => {
  const $ = id => document.getElementById(id);

  const esc = value => String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);

  const configResponse = await fetch("./merch.json");
  if (!configResponse.ok) {
    throw new Error("Could not load merch.json (" + configResponse.status + ")");
  }

  const config = await configResponse.json();

  let languages = {};
  try {
    const languageResponse = await fetch("./merch-lang.json");
    if (languageResponse.ok) {
      languages = await languageResponse.json();
    }
  } catch (error) {
    console.warn("Optional language file could not be loaded.", error);
  }

  const language = config.site?.defaultLanguage || config.cookies?.defaultLanguage || "en";
  const dictionary = languages[language] || languages.en || languages;

  const fallbackLabels = {
    productDetails: "PRODUCT DETAILS",
    yourCart: "YOUR CART",
    noMatchingProducts: "NO MATCHING PRODUCTS",
    noProductsAvailable: "NO PRODUCTS AVAILABLE",
    selectOption: "PLEASE SELECT AN OPTION",
    quantity: "QUANTITY",
    addToCart: "ADD TO CART",
    cartEmpty: config.cart?.emptyHeading || "Your cart is empty",
    continueShopping: "CONTINUE SHOPPING",
    remove: "REMOVE",
    subtotal: "SUBTOTAL",
    checkout: "CHECKOUT",
    checkoutUnavailable:
      config.checkout?.messages?.checkoutUnavailable ||
      config.cart?.checkoutUnavailableMessage ||
      "Checkout is not available yet.",
    shippingDisclaimer:
      config.cart?.shippingDisclaimer ||
      "Shipping, taxes, and any applicable fees are calculated at checkout.",
    cookieChoices: "COOKIE CHOICES",
    help: "HELP",
    terms: "TERMS AND CONDITIONS OF SALE",
    privacy: "PRIVACY POLICY",
    legalNotice: "LEGAL NOTICE",
    trackingTechnologies: "TRACKING TECHNOLOGIES",
    refundPolicy: "REFUND POLICY",
    shipping: "SHIPPING",
    termsOfUse: "TERMS OF USE"
  };

  const t = key =>
    dictionary?.[key] ??
    config.account?.labels?.[key] ??
    config.labels?.[key] ??
    config.cookies?.labels?.[key] ??
    config.cart?.[key] ??
    fallbackLabels[key] ??
    key;

  const products = Array.isArray(config.products) ? config.products : [];

  const categories = config.categories || [
    "ALL",
    "CD",
    "VINYL",
    "TOPS",
    "OUTERWEAR",
    "PANTS",
    "XTRAS",
    "ALL MERCH"
  ];

  const grid = $("product-grid");
  const empty = $("empty-message");
  const category = $("category-select");
  const detail = $("detail-overlay");
  const cartOverlay = $("cart-overlay");
  const detailContent = $("detail-content");
  const cartContent = $("cart-content");

  let activeCategory = "ALL";
  let query = "";
  let cart = [];
  let activeProduct = null;
  let quantity = 1;
  let variant = "";

  const footerLabels = {
    help: "help",
    terms: "terms",
    privacy: "privacy",
    legalNotice: "legalNotice",
    trackingTechnologies: "trackingTechnologies",
    refundPolicy: "refundPolicy",
    shipping: "shipping",
    termsOfUse: "termsOfUse"
  };

  const footerPaths = {
    help: config.paths?.help || config.policies?.links?.help || "help.html",
    terms: config.paths?.termsPage || config.policies?.links?.terms || "policies/terms-of-sale.html",
    privacy: config.paths?.privacyPage || config.policies?.links?.privacy || "policies/privacy-policy.html",
    legalNotice: config.paths?.legalNoticePage || config.policies?.links?.legalNotice || "policies/legal-notice.html",
    trackingTechnologies: config.paths?.trackingTechnologies || config.policies?.links?.trackingTechnologies || "policies/privacy-policy.html#tracking-technologies",
    refundPolicy: config.paths?.refundPolicy || config.policies?.links?.refundPolicy || "policies/refund-policy.html",
    shipping: config.paths?.shippingPolicy || config.policies?.links?.shipping || "policies/shipping.html",
    termsOfUse: config.paths?.termsOfUse || config.policies?.links?.termsOfUse || "policies/terms-of-use.html"
  };

  category.innerHTML = categories.map(item => {
    const value = typeof item === "string" ? item : item.value;
    const label = typeof item === "string" ? item : item.label || value;
    return `<option value="${esc(value)}">${esc(label)}</option>`;
  }).join("");

  $("copyright").textContent =
    config.site?.copyright ||
    config.copyright ||
    "";

  $("detail-drawer-title").textContent = t("productDetails");
  $("cart-drawer-title").textContent = t("yourCart");

  $("footer-links").innerHTML =
    Object.entries(footerPaths).map(([key, path]) =>
      `<a href="${esc(path)}">${esc(t(footerLabels[key]))}</a>`
    ).join("") +
    `<button type="button" id="cookie-choices">${esc(t("cookieChoices"))}</button>`;

  function price(product) {
    const number = Number(String(product.price ?? 0).replace(/[^0-9.-]/g, ""));
    return Number.isFinite(number) ? number : 0;
  }

  function money(amount) {
    const currency = config.cart?.currency || config.checkout?.currency || "USD";

    try {
      return new Intl.NumberFormat(language === "en" ? "en-US" : language, {
        style: "currency",
        currency
      }).format(amount);
    } catch {
      return `${currency} ${amount.toFixed(2)}`;
    }
  }

  function displayPrice(product) {
    return money(price(product));
  }

  function variants(product) {
    const id = String(product.id || "").toLowerCase();
    const type = String(product.type || "").toUpperCase();
    const category = String(product.category || "").toUpperCase();
    let source = product.variants || product.sizes || [];

    if (id === "gta-love-poster-1") source = ["40 × 30 cm", "80 × 60 cm", "120 × 80 cm"];
    else if (id === "gta-love-poster-2") source = ["30 × 45 cm", "45 × 60 cm", "60 × 90 cm"];
    else if (!source.length && ["TOPS", "OUTERWEAR", "PANTS"].includes(category)) {
      source = category === "PANTS"
        ? ["XS", "S", "M", "L", "XL", "XXL"]
        : ["XS", "S", "M", "L", "XL", "XXL"];
    }

    return source.map(item =>
      typeof item === "object"
        ? {
            label: String(item.label || item.name || item.value),
            value: String(item.value || item.label || item.name)
          }
        : {
            label: String(item),
            value: String(item)
          }
    );
  }

  function imageList(product) {
    return product.images?.length
      ? product.images
      : [product.image].filter(Boolean);
  }

  function visibleProducts() {
    return products.filter(product => {
      if (product.active === false) return false;

      const productCategory = String(product.category || "").toUpperCase();
      const material = String(product.material || "").toUpperCase();

      const matchesCategory =
        activeCategory === "ALL" ||
        (activeCategory === "ALL MERCH" &&
          ["TEXTILE", "TEXTILES"].includes(material)) ||
        (activeCategory === "XTRAS" && productCategory === "XTRAS") ||
        productCategory === activeCategory;

      const searchText = [
        product.name,
        product.type,
        product.category,
        product.description,
        product.material
      ].join(" ").toLowerCase();

      return matchesCategory && searchText.includes(query);
    });
  }

  function renderProducts() {
    grid.replaceChildren();

    const list = visibleProducts();
    empty.hidden = list.length > 0;
    empty.textContent = t(query ? "noMatchingProducts" : "noProductsAvailable");

    list.forEach(product => {
      const item = document.createElement("article");
      const images = imageList(product);

      item.className = "product";
      item.tabIndex = 0;
      item.setAttribute("role", "button");
      item.setAttribute("aria-label", product.name || "Product");

      item.innerHTML = `
        <div class="product-image-wrap">
          <img
            class="product-image"
            src="${esc(images[0] || "")}"
            alt="${esc(product.name)}"
            loading="lazy"
          >
        </div>
        <div class="product-caption">
          <div class="product-name">${esc(product.name)}</div>
          <div class="product-price">${esc(displayPrice(product))}</div>
        </div>
      `;

      item.addEventListener("click", () => openProduct(product));

      item.addEventListener("keydown", event => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          openProduct(product);
        }
      });

      grid.append(item);
    });
  }

  function openOverlay(overlay) {
    overlay.hidden = false;

    requestAnimationFrame(() => {
      overlay.classList.add("is-open");
      overlay.setAttribute("aria-hidden", "false");
      document.body.classList.add("modal-open");
      overlay.querySelector(".drawer-close")?.focus();
    });
  }

  function closeOverlay(overlay) {
    overlay.classList.remove("is-open");
    overlay.setAttribute("aria-hidden", "true");

    window.setTimeout(() => {
      if (!overlay.classList.contains("is-open")) {
        overlay.hidden = true;
      }

      const anotherDrawerIsOpen =
        document.querySelector(".drawer-overlay.is-open") !== null;

      document.body.classList.toggle("modal-open", anotherDrawerIsOpen);
    }, 260);
  }

  function openProduct(product) {
    activeProduct = product;
    quantity = 1;
    variant = "";

    const images = imageList(product);
    const options = variants(product);
    let activeImageIndex = 0;
    const productCategory = String(product.category || "").trim();
    const productType = String(product.type || "").toUpperCase();
    const productId = String(product.id || "").toLowerCase();
    const posterClass = productId === "gta-love-poster-1"
      ? " is-poster-1"
      : productId === "gta-love-poster-2" ? " is-poster-2" : "";
    const isPoster = productType === "POSTER" || posterClass !== "";
    const galleryImages = images;

    detailContent.innerHTML = `
      <nav class="detail-breadcrumb" aria-label="Breadcrumb">
        <button type="button" data-breadcrumb-home>Home</button>
        ${productCategory ? `
          <span aria-hidden="true">›</span>
          <button type="button" data-breadcrumb-category="${esc(productCategory)}">${esc(productCategory)}</button>
        ` : ""}
        <span aria-hidden="true">›</span>
        <span aria-current="page">${esc(product.name)}</span>
      </nav>

      <div class="detail-layout">
        <div class="detail-gallery${posterClass}${isPoster ? " is-poster" : ""}">
          ${galleryImages.length ? `
            <div class="detail-thumbnails">
              ${galleryImages.map((src, index) => `
                <button
                  type="button"
                  class="detail-thumb${index === 0 ? " is-active" : ""}"
                  data-image="${index}"
                  aria-label="View image ${index + 1}"
                  aria-pressed="${index === 0 ? "true" : "false"}"
                >
                  <img src="${esc(src)}" alt="">
                </button>
              `).join("")}
            </div>
          ` : ""}

          <div class="detail-image-stage">
            <div class="detail-main-image">
              <img data-main-image src="${esc(images[0] || "")}" alt="${esc(product.name)}" loading="eager" decoding="async">
            </div>
            ${galleryImages.length > 1 ? `
              <div class="detail-image-dots" role="group" aria-label="Choose product image">
                ${galleryImages.map((_, index) => `
                  <button type="button" class="detail-image-dot${index === 0 ? " is-active" : ""}"
                    data-image-dot="${index}" aria-label="Show image ${index + 1}"
                    aria-pressed="${index === 0 ? "true" : "false"}"></button>
                `).join("")}
              </div>
            ` : ""}
          </div>
        </div>

        <div class="detail-info">
          <h3 class="detail-name">${esc(product.name)}</h3>
          <div class="detail-price">${esc(displayPrice(product))}</div>

          ${options.length ? `
            <div class="detail-field">
              <p class="detail-field-label">${esc(product.variantLabel || "SIZE")}</p>
              <div class="detail-variants${isPoster ? " is-poster-sizes" : " is-textile-sizes"}">
                ${options.map(option => `
                  <button type="button" class="variant-button" data-variant="${esc(option.value)}">${esc(option.label)}</button>
                `).join("")}
              </div>
            </div>
          ` : ""}

          <div class="detail-field">
            <p class="detail-field-label">${esc(t("quantity"))}</p>
            <div class="detail-quantity">
              <button type="button" class="quantity-button" data-qty="-1" aria-label="Decrease quantity">−</button>
              <span class="quantity-value" id="detail-quantity-value">1</span>
              <button type="button" class="quantity-button" data-qty="1" aria-label="Increase quantity">+</button>
            </div>
          </div>

          <button type="button" class="primary-button full-button detail-add" id="detail-add">
            ${esc(t("addToCart"))}
          </button>

          <p class="detail-description">${esc(product.description || "")}</p>
          <p class="detail-note">${esc([product.type, product.material].filter(Boolean).join(" · "))}</p>
        </div>
      </div>
    `;

    detailContent.querySelector("[data-breadcrumb-home]").onclick = () => {
      activeCategory = "ALL";
      category.value = categories.some(item => (typeof item === "string" ? item : item.value) === "ALL")
        ? "ALL"
        : (typeof categories[0] === "string" ? categories[0] : categories[0]?.value);
      query = "";
      $("search-input").value = "";
      renderProducts();
      closeOverlay(detail);
    };

    const categoryCrumb = detailContent.querySelector("[data-breadcrumb-category]");
    if (categoryCrumb) {
      categoryCrumb.onclick = () => {
        const value = categoryCrumb.dataset.breadcrumbCategory;
        activeCategory = value;
        if ([...category.options].some(option => option.value === value)) category.value = value;
        query = "";
        $("search-input").value = "";
        renderProducts();
        closeOverlay(detail);
      };
    }

    const selectImage = index => {
      if (index < 0 || index >= images.length) return;
      activeImageIndex = index;
      const mainImage = detailContent.querySelector("[data-main-image]");
      if (mainImage) mainImage.src = images[index];

      detailContent.querySelectorAll("[data-image]").forEach(button => {
        const active = Number(button.dataset.image) === index;
        button.classList.toggle("is-active", active);
        button.setAttribute("aria-pressed", String(active));
      });
      detailContent.querySelectorAll("[data-image-dot]").forEach(button => {
        const active = Number(button.dataset.imageDot) === index;
        button.classList.toggle("is-active", active);
        button.setAttribute("aria-pressed", String(active));
      });
    };

    detailContent.querySelectorAll("[data-image]").forEach(button => {
      button.onclick = () => selectImage(Number(button.dataset.image));
    });
    detailContent.querySelectorAll("[data-image-dot]").forEach(button => {
      button.onclick = () => selectImage(Number(button.dataset.imageDot));
    });

    detailContent.querySelectorAll("[data-variant]").forEach(button => {
      button.onclick = () => {
        variant = button.dataset.variant;
        detailContent.querySelectorAll("[data-variant]").forEach(option => {
          option.classList.toggle("is-selected", option === button);
          option.setAttribute("aria-pressed", String(option === button));
        });
        const error = detailContent.querySelector(".detail-error");
        if (error) error.remove();
      };
      button.setAttribute("aria-pressed", "false");
    });

    detailContent.querySelectorAll("[data-qty]").forEach(button => {
      button.onclick = () => {
        const maxQuantity = config.cart?.maxItemQuantity || 99;
        quantity = Math.max(1, Math.min(maxQuantity, quantity + Number(button.dataset.qty)));
        $("detail-quantity-value").textContent = quantity;
      };
    });

    $("detail-add").onclick = () => {
      if (options.length && !variant) {
        let error = detailContent.querySelector(".detail-error");
        if (!error) {
          error = document.createElement("p");
          error.className = "detail-error";
          $("detail-add").after(error);
        }
        error.textContent = t("selectOption");
        return;
      }

      const key = `${String(product.id ?? product.name)}::${variant}`;
      const existing = cart.find(item => item.key === key);
      const maxQuantity = config.cart?.maxItemQuantity || 99;

      if (existing) {
        existing.quantity = Math.min(maxQuantity, existing.quantity + quantity);
      } else {
        cart.push({ key, product, variant, quantity });
      }

      renderCart();
      closeOverlay(detail);
    };

    openOverlay(detail);
  }

    function renderCart() {
    const count = cart.reduce((total, item) => total + item.quantity, 0);

    $("cart-count").textContent = count;
    $("cart-drawer-title").textContent = `${t("yourCart")} (${count})`;

    if (!cart.length) {
      cartContent.innerHTML = `
        <div class="drawer-empty">
          <h2>${esc(config.cart?.emptyHeading || t("cartEmpty"))}</h2>
          <p>${esc(config.cart?.emptyText || "")}</p>
          <button type="button" class="secondary-button" id="continue-shopping">
            ${esc(t("continueShopping"))}
          </button>
        </div>
      `;

      $("continue-shopping").onclick = () => closeOverlay(cartOverlay);
      return;
    }

    const subtotal = cart.reduce(
      (total, item) => total + price(item.product) * item.quantity,
      0
    );

    cartContent.innerHTML = `
      <div class="cart-items">
        ${cart.map(item => `
          <article class="cart-item">
            <div class="cart-item-image">
              <img
                src="${esc(item.product.image || imageList(item.product)[0] || "")}"
                alt="${esc(item.product.name)}"
              >
            </div>

            <div class="cart-item-info">
              <h3 class="cart-item-name">${esc(item.product.name)}</h3>

              ${item.variant
                ? `<div class="cart-item-variant">${esc(item.variant)}</div>`
                : ""}

              <div class="cart-item-price">${esc(displayPrice(item.product))}</div>

              <div class="cart-item-bottom">
                <div class="cart-quantity">
                  <button
                    type="button"
                    data-change="-1"
                    data-key="${esc(item.key)}"
                    aria-label="Decrease quantity"
                  >−</button>

                  <span>${item.quantity}</span>

                  <button
                    type="button"
                    data-change="1"
                    data-key="${esc(item.key)}"
                    aria-label="Increase quantity"
                  >+</button>
                </div>

                <button
                  type="button"
                  class="cart-remove"
                  data-remove="${esc(item.key)}"
                >${esc(t("remove"))}</button>
              </div>
            </div>
          </article>
        `).join("")}
      </div>

      <div class="cart-summary">
        <div class="cart-subtotal">
          <span>${esc(t("subtotal"))}</span>
          <strong>${esc(money(subtotal))}</strong>
        </div>

        <p class="cart-disclaimer">
          ${esc(config.cart?.shippingDisclaimer || t("shippingDisclaimer"))}
        </p>

        <button type="button" class="primary-button full-button" id="checkout-button">
          ${esc(t("checkout"))}
        </button>

        <button type="button" class="secondary-button full-button" id="cart-continue">
          ${esc(t("continueShopping"))}
        </button>
      </div>
    `;

    cartContent.querySelectorAll("[data-change]").forEach(button => {
      button.onclick = () => {
        const item = cart.find(entry => entry.key === button.dataset.key);
        if (!item) return;

        const maxQuantity = config.cart?.maxItemQuantity || 99;

        item.quantity = Math.max(
          0,
          Math.min(maxQuantity, item.quantity + Number(button.dataset.change))
        );

        cart = cart.filter(entry => entry.quantity > 0);
        renderCart();
      };
    });

    cartContent.querySelectorAll("[data-remove]").forEach(button => {
      button.onclick = () => {
        cart = cart.filter(item => item.key !== button.dataset.remove);
        renderCart();
      };
    });

    $("cart-continue").onclick = () => closeOverlay(cartOverlay);

    $("checkout-button").onclick = () => {
      if (config.checkout?.enabled !== true) {
        alert(t("checkoutUnavailable"));
        return;
      }

      if (window.VNCheckout?.open) {
        window.VNCheckout.open(cart);
      } else if (typeof window.openCheckout === "function") {
        window.openCheckout(cart);
      } else {
        alert(t("checkoutUnavailable"));
      }
    };
  }

  category.onchange = () => {
    activeCategory = category.value;
    renderProducts();
  };

  $("search-form").onsubmit = event => event.preventDefault();

  $("search-input").oninput = event => {
    query = event.target.value.trim().toLowerCase();
    renderProducts();
  };

  $("search-toggle").onclick = () => {
    const panel = $("search-panel");
    const show = panel.hidden;

    panel.hidden = !show;
    panel.classList.toggle("is-open", show);
    $("search-toggle").setAttribute("aria-expanded", String(show));

    if (show) {
      $("search-input").focus();
    } else {
      $("search-input").value = "";
      query = "";
      renderProducts();
    }
  };

  $("search-close").onclick = () => {
    $("search-panel").hidden = true;
    $("search-panel").classList.remove("is-open");
    $("search-toggle").setAttribute("aria-expanded", "false");
    $("search-input").value = "";
    query = "";
    renderProducts();
  };

  $("cart-open").onclick = event => {
    event.preventDefault();
    renderCart();
    openOverlay(cartOverlay);
  };

  $("profile-open").onclick = () => {
    if (window.VNAccount?.open) {
      window.VNAccount.open();
    } else {
      console.error("VNAccount.open is unavailable. Check account.js initialization.");
    }
  };

  $("detail-close").onclick = () => closeOverlay(detail);
  $("cart-close").onclick = () => closeOverlay(cartOverlay);

  [detail, cartOverlay].forEach(overlay => {
    overlay.onclick = event => {
      if (event.target === overlay) closeOverlay(overlay);
    };
  });

  document.addEventListener("keydown", event => {
    if (event.key === "Escape") {
      document.querySelectorAll(".drawer-overlay.is-open").forEach(closeOverlay);
    }
  });

  $("cookie-choices").onclick = () => {
    if (typeof window.openCookiePreferences === "function") {
      window.openCookiePreferences();
    } else {
      console.warn("Cookie preferences panel is not initialized.");
    }
  };

  window.VNShop = {
    config,
    products,
    getCart: () => cart,
    renderCart,
    renderProducts,
    openProduct
  };

  renderProducts();
  renderCart();

})().catch(error => {
  console.error("VN SHOP initialization failed:", error);

  const empty = document.getElementById("empty-message");

  if (empty) {
    empty.hidden = false;
    empty.textContent = "SHOP CONFIGURATION COULD NOT BE LOADED";
  }
});
</script>

</body>
</html>
