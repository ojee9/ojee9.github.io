
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Explore official VN RECORDS merchandise, clothing and products.">
<meta name="theme-color" content="#C6BBA7">
<title>VN SHOP® — 9ojeez9</title>
<link rel="stylesheet" href="merch.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header class="header">
  <a class="projects-logo" href="index.html" aria-label="OJEE home">OJEE<span>®</span></a>
  <div class="header-actions">
    <a class="icon-link" id="cart-open" href="#cart" aria-label="Shopping cart"><span id="cart-count">0</span></a>
    <button class="icon-button" id="profile-open" type="button" aria-label="Account">ACCOUNT</button>
  </div>
</header>

<nav class="catalog-bar" aria-label="Product categories">
  <label for="category-select" hidden>Category</label>
  <select class="category-select" id="category-select"></select>
  <button class="icon-button search-toggle" id="search-toggle" type="button" aria-expanded="false" aria-controls="search-panel" aria-label="Search">⌕</button>
</nav>

<section class="search-panel" id="search-panel" hidden>
  <form class="search-form" id="search-form" role="search">
    <input class="search-input" id="search-input" type="search" autocomplete="off" placeholder="Search products" aria-label="Search products">
    <button class="search-close" id="search-close" type="button" aria-label="Close search">×</button>
  </form>
</section>

<main>
  <section class="products" aria-live="polite">
    <div class="product-grid" id="product-grid"></div>
    <div class="empty" id="empty-message" hidden></div>
  </section>
</main>

<footer class="footer">
  <nav class="footer-links" id="footer-links" aria-label="Help and legal"></nav>
  <div class="copyright" id="copyright"></div>
</footer>

<div class="drawer-overlay" id="detail-overlay" aria-hidden="true">
  <section class="drawer" role="dialog" aria-modal="true" aria-labelledby="detail-drawer-title">
    <header class="drawer-head">
      <h2 class="drawer-title" id="detail-drawer-title">PRODUCT DETAILS</h2>
      <button class="drawer-close" id="detail-close" type="button" aria-label="Close">×</button>
    </header>
    <div class="drawer-content" id="detail-content"></div>
  </section>
</div>

<div class="drawer-overlay" id="cart-overlay" aria-hidden="true">
  <section class="drawer" role="dialog" aria-modal="true" aria-labelledby="cart-drawer-title">
    <header class="drawer-head">
      <h2 class="drawer-title" id="cart-drawer-title">YOUR CART</h2>
      <button class="drawer-close" id="cart-close" type="button" aria-label="Close">×</button>
    </header>
    <div class="drawer-content" id="cart-content"></div>
  </section>
</div>

<div id="merch-config-ui"></div>

<script src="account.js"></script>
<script src="checkout.js"></script>
<script>
"use strict";
(async()=>{
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const configResponse=await fetch("./merch.json");
if(!configResponse.ok)throw Error("Could not load merch.json ("+configResponse.status+")");
const config=await configResponse.json();
const langResponse=await fetch("./merch-lang.json");
if(!langResponse.ok)throw Error("Could not load merch-lang.json ("+langResponse.status+")");
const languages=await langResponse.json();
const language=config.cookies?.defaultLanguage||"en";
const dictionary=languages[language]||languages.en||languages;
const t=k=>dictionary[k]??config.labels?.[k]??config.cookies?.labels?.[k]??k;
const products=Array.isArray(config.products)?config.products:[];
const categories=config.categories||["ALL","CD","VINYL","TOPS","OUTERWEAR","PANTS","XTRAS","ALL MERCH"];
const grid=$("product-grid"),empty=$("empty-message"),category=$("category-select");
const detail=$("detail-overlay"),cartOverlay=$("cart-overlay");
const detailContent=$("detail-content"),cartContent=$("cart-content");
let activeCategory="ALL",query="",cart=[],activeProduct=null,quantity=1,variant="";

category.innerHTML=categories.map(c=>{
 const value=typeof c==="string"?c:c.value;
 return `<option value="${esc(value)}">${esc(typeof c==="string"?c:c.label||value)}</option>`;
}).join("");

$("copyright").textContent=config.copyright||config.site?.copyright||"";
$("detail-drawer-title").textContent=t("productDetails");
$("cart-drawer-title").textContent=t("yourCart");

const footerLinks=config.policies?.links||{};
$("footer-links").innerHTML=Object.entries(footerLinks).map(([key,item])=>{
 item=typeof item==="string"?{url:item,label:key}:item;
 return `<a href="${esc(item.url||item.href||"#")}">${esc(item.label||key)}</a>`;
}).join("")+`<button type="button" id="cookie-choices">${esc(t("cookieChoices"))}</button>`;

function price(p){
 const n=Number(String(p.price??0).replace(/[^0-9.-]/g,""));
 return Number.isFinite(n)?n:0;
}
function money(n){
 try{return new Intl.NumberFormat(language,{style:"currency",currency:config.currency||"USD"}).format(n)}
 catch{return String(n)}
}
function variants(p){
 return (p.variants||p.sizes||[]).map(v=>typeof v==="object"
 ?{label:String(v.label||v.name||v.value),value:String(v.value||v.label||v.name)}
 :{label:String(v),value:String(v)});
}
function imageList(p){return p.images?.length?p.images:[p.image].filter(Boolean)}
function visibleProducts(){
 return products.filter(p=>{
  const cat=String(p.category||"").toUpperCase();
  const material=String(p.material||"").toUpperCase();
  const matches=activeCategory==="ALL"||
   (activeCategory==="ALL MERCH"&&(material==="TEXTILE"||material==="TEXTILES"))||
   (activeCategory==="XTRAS"&&cat==="XTRAS")||cat===activeCategory;
  return matches&&`${p.name||""} ${p.type||""} ${p.category||""} ${p.description||""}`.toLowerCase().includes(query);
 });
}
function renderProducts(){
 grid.replaceChildren();
 const list=visibleProducts();
 empty.hidden=list.length>0;
 empty.textContent=t(query?"noMatchingProducts":"noProductsAvailable");
 list.forEach(p=>{
  const item=document.createElement("article");
  item.className="product";item.tabIndex=0;item.setAttribute("role","button");
  item.setAttribute("aria-label",p.name||"Product");
  item.innerHTML=`<div class="product-image-wrap"><img class="product-image" src="${esc(p.image||imageList(p)[0]||"")}" alt="${esc(p.name)}" loading="lazy"></div><div class="product-caption"><div class="product-name">${esc(p.name)}</div><div class="product-price">${esc(p.price)}</div></div>`;
  item.onclick=()=>openProduct(p);
  item.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openProduct(p)}};
  grid.append(item);
 });
}
function open(overlay){
 overlay.hidden=false;overlay.classList.add("is-open");overlay.setAttribute("aria-hidden","false");
 document.body.classList.add("modal-open");
 overlay.querySelector(".drawer-close")?.focus();
}
function close(overlay){
 overlay.classList.remove("is-open");overlay.setAttribute("aria-hidden","true");
 overlay.hidden=true;
 document.body.classList.toggle("modal-open",!!document.querySelector(".drawer-overlay.is-open"));
}
function openProduct(p){
 activeProduct=p;quantity=1;variant="";
 const imgs=imageList(p),opts=variants(p);
 detailContent.innerHTML=`<div class="detail-layout">
  <div class="detail-gallery"><div class="detail-main-image"><img src="${esc(imgs[0]||"")}" alt="${esc(p.name)}"></div>
  ${imgs.length>1?`<div class="detail-thumbnails">${imgs.map((src,i)=>`<button type="button" data-image="${i}" aria-label="View image ${i+1}"><img src="${esc(src)}" alt=""></button>`).join("")}</div>`:""}</div>
  <div class="detail-info"><h3 class="detail-name">${esc(p.name)}</h3><div class="detail-price">${esc(p.price)}</div>
  ${opts.length?`<div class="detail-field"><p class="detail-field-label">${esc(p.variantLabel||t("selectOption"))}</p><div class="detail-variants">${opts.map(v=>`<button type="button" class="variant-button" data-variant="${esc(v.value)}">${esc(v.label)}</button>`).join("")}</div></div>`:""}
  <div class="detail-field"><p class="detail-field-label">${esc(t("quantity"))}</p><div class="detail-quantity"><button type="button" data-qty="-1">−</button><span id="detail-quantity-value">1</span><button type="button" data-qty="1">+</button></div></div>
  <button type="button" class="primary-button full-button" id="detail-add">${esc(t("addToCart"))}</button>
  <p class="detail-description">${esc(p.description||"")}</p><p class="detail-note">${esc(p.type||"")} ${esc(p.material||"")}</p></div></div>`;
 detailContent.querySelectorAll("[data-image]").forEach(b=>b.onclick=()=>detailContent.querySelector(".detail-main-image img").src=imgs[Number(b.dataset.image)]);
 detailContent.querySelectorAll("[data-variant]").forEach(b=>b.onclick=()=>{
  variant=b.dataset.variant;
  detailContent.querySelectorAll("[data-variant]").forEach(x=>x.classList.toggle("is-selected",x===b));
 });
 detailContent.querySelectorAll("[data-qty]").forEach(b=>b.onclick=()=>{
  quantity=Math.max(1,Math.min(99,quantity+Number(b.dataset.qty)));
  $("detail-quantity-value").textContent=quantity;
 });
 $("detail-add").onclick=()=>{
  if(opts.length&&!variant){
   let error=detailContent.querySelector(".detail-error");
   if(!error){error=document.createElement("p");error.className="detail-error";$("detail-add").after(error)}
   error.textContent=t("selectOption");return;
  }
  const key=String(p.id??p.name)+"::"+variant;
  const existing=cart.find(x=>x.key===key);
  if(existing)existing.quantity=Math.min(99,existing.quantity+quantity);
  else cart.push({key,product:p,variant,quantity});
  renderCart();close(detail);open(cartOverlay);
 };
 open(detail);
}
function renderCart(){
 const count=cart.reduce((n,x)=>n+x.quantity,0);
 $("cart-count").textContent=count;
 $("cart-drawer-title").textContent=`${t("yourCart")} (${count})`;
 if(!cart.length){
  cartContent.innerHTML=`<div class="drawer-empty"><h2>${esc(t("cartEmpty"))}</h2><button type="button" class="secondary-button" id="continue-shopping">${esc(t("continueShopping"))}</button></div>`;
  $("continue-shopping").onclick=()=>close(cartOverlay);
  return;
 }
 const subtotal=cart.reduce((n,x)=>n+price(x.product)*x.quantity,0);
 cartContent.innerHTML=`<div class="cart-items">${cart.map(x=>`<article class="cart-item"><div class="cart-item-image"><img src="${esc(x.product.image||imageList(x.product)[0]||"")}" alt="${esc(x.product.name)}"></div><div class="cart-item-info"><h3 class="cart-item-name">${esc(x.product.name)}</h3>${x.variant?`<div>${esc(x.variant)}</div>`:""}<div class="cart-item-price">${esc(x.product.price)}</div><div class="cart-item-bottom"><div class="cart-quantity"><button type="button" data-change="-1" data-key="${esc(x.key)}">−</button><span>${x.quantity}</span><button type="button" data-change="1" data-key="${esc(x.key)}">+</button></div><button type="button" data-remove="${esc(x.key)}">${esc(t("remove"))}</button></div></div></article>`).join("")}</div>
 <div class="cart-summary"><div class="cart-subtotal"><span>${esc(t("subtotal"))}</span><strong>${esc(money(subtotal))}</strong></div><p class="cart-disclaimer">${esc(t("shippingDisclaimer"))}</p><button type="button" class="primary-button full-button" id="checkout-button">${esc(t("checkout"))}</button><button type="button" class="secondary-button full-button" id="cart-continue">${esc(t("continueShopping"))}</button></div>`;
 cartContent.querySelectorAll("[data-change]").forEach(b=>b.onclick=()=>{
  const item=cart.find(x=>x.key===b.dataset.key);
  if(item)item.quantity=Math.max(0,Math.min(99,item.quantity+Number(b.dataset.change)));
  cart=cart.filter(x=>x.quantity>0);renderCart();
 });
 cartContent.querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>{
  cart=cart.filter(x=>x.key!==b.dataset.remove);renderCart();
 });
 $("cart-continue").onclick=()=>close(cartOverlay);
 $("checkout-button").onclick=()=>{
  if(window.VNCheckout?.open){window.VNCheckout.open(cart);}
  else if(typeof window.openCheckout==="function"){window.openCheckout(cart);}
  else alert(t("checkoutUnavailable"));
 };
}
category.onchange=()=>{activeCategory=category.value;renderProducts()};
$("search-form").onsubmit=e=>e.preventDefault();
$("search-input").oninput=e=>{query=e.target.value.trim().toLowerCase();renderProducts()};
$("search-toggle").onclick=()=>{
 const panel=$("search-panel"),show=panel.hidden;
 panel.hidden=!show;panel.classList.toggle("is-open",show);
 $("search-toggle").setAttribute("aria-expanded",String(show));
 if(show)$("search-input").focus();
 else{$("search-input").value="";query="";renderProducts()}
};
$("search-close").onclick=()=>{
 $("search-panel").hidden=true;$("search-panel").classList.remove("is-open");
 $("search-toggle").setAttribute("aria-expanded","false");
 $("search-input").value="";query="";renderProducts();
};
$("cart-open").onclick=e=>{e.preventDefault();renderCart();open(cartOverlay)};
$("detail-close").onclick=()=>close(detail);
$("cart-close").onclick=()=>close(cartOverlay);
[detail,cartOverlay].forEach(el=>el.onclick=e=>{if(e.target===el)close(el)});
document.addEventListener("keydown",e=>{
 if(e.key==="Escape")document.querySelectorAll(".drawer-overlay.is-open").forEach(close);
});
$("cookie-choices").onclick=()=>{
 if(typeof window.openCookiePreferences==="function")window.openCookiePreferences();
 else alert(t("cookieChoices"));
};
window.VNShop={config,products,getCart:()=>cart,renderCart,renderProducts};

renderProducts();renderCart();
})().catch(error=>{
 console.error("VN SHOP initialization failed:",error);
 const empty=document.getElementById("empty-message");
 if(empty){empty.hidden=false;empty.textContent="SHOP CONFIGURATION COULD NOT BE LOADED";}
});
</script>
</body>
</html>
