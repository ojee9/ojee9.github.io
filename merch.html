
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MERCH — 9O9</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  background:#0b0c12;
  font-family:Arial, sans-serif;
  color:white;
}

.back{
  position:absolute;
  top:30px;
  left:30px;
  color:#fff4c2;
  text-decoration:none;
  font-size:14px;
  letter-spacing:2px;
  transition:0.3s;
}

.back:hover{

}

.container{

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:100px 20px 60px;
  text-align:center;
}

h1{
  margin:0;
  color:#fff4c2;
  font-size:clamp(42px, 8vw, 76px);
  letter-spacing:10px;
}

.subtitle{
  margin-top:20px;
  color:#858595;
  font-size:12px;
  letter-spacing:4px;
}

.coming-soon{
  margin-top:100px;
  color:#fff4c2;
  font-size:14px;
  letter-spacing:5px;
}

.line{
  width:60px;
  height:2px;
  background:#ffd54f;
  margin:25px auto 0;
}

@media(max-width:768px){
  .back{
    top:22px;
    left:20px;
  }

  h1{
    letter-spacing:6px;
  }

  .subtitle{
    font-size:10px;
