
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Explore official VN RECORDS merchandise, clothing and products.">
<meta name="theme-color" content="#C6BBA7">
<title>VN SHOP® — 9ojeez9</title>
<link rel="stylesheet" href="merch.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header class="header">
  <a class="projects-logo" href="index.html" aria-label="OJEE home">OJEE<span>®</span></a>
  <div class="header-actions">
    <a class="icon-link" id="cart-open" href="#cart" aria-label="Shopping cart"><span id="cart-count">0</span></a>
    <button class="icon-button" id="profile-open" type="button" aria-label="Sign in"></button>
  </div>
</header>

<nav class="catalog-bar" aria-label="Product categories">
  <label for="category-select" hidden>Category</label>
  <select class="category-select" id="category-select"></select>
  <button class="icon-button search-toggle" id="search-toggle" type="button" aria-expanded="false" aria-controls="search-panel" aria-label="Search">⌕</button>
</nav>

<section class="search-panel" id="search-panel">
  <form class="search-form" id="search-form" role="search">
    <input class="search-input" id="search-input" type="search" autocomplete="off">
    <button class="search-close" id="search-close" type="button" aria-label="Close search">×</button>
  </form>
</section>

<main>
  <section class="products" aria-live="polite">
    <div class="product-grid" id="product-grid"></div>
    <div class="empty" id="empty-message" hidden></div>
  </section>
</main>

<footer class="footer">
  <nav class="footer-links" id="footer-links" aria-label="Help and legal"></nav>
  <div class="copyright" id="copyright"></div>
</footer>

<div class="drawer-overlay" id="detail-overlay" aria-hidden="true">
  <section class="drawer" role="dialog" aria-modal="true" aria-labelledby="detail-drawer-title">
    <header class="drawer-head">
      <h2 class="drawer-title" id="detail-drawer-title"></h2>
      <button class="drawer-close" id="detail-close" type="button" aria-label="Close">×</button>
    </header>
    <div class="drawer-content" id="detail-content"></div>
  </section>
</div>

<div class="drawer-overlay" id="cart-overlay" aria-hidden="true">
  <section class="drawer" role="dialog" aria-modal="true" aria-labelledby="cart-drawer-title">
    <header class="drawer-head">
      <h2 class="drawer-title" id="cart-drawer-title"></h2>
      <button class="drawer-close" id="cart-close" type="button" aria-label="Close">×</button>
    </header>
    <div class="drawer-content" id="cart-content"></div>
  </section>
</div>

<div id="merch-config-ui"></div>

<script>
"use strict";

(async()=>{
const $=id=>document.getElementById(id);
const esc=value=>String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const config=await fetch("merch.json").then(r=>{if(!r.ok)throw Error("merch.json");return r.json()});
const languages=await fetch("lang.json").then(r=>{if(!r.ok)throw Error("lang.json");return r.json()});
const products=config.products||[];
const labels=config.labels||{};
const language=config.cookies?.defaultLanguage||"en";
const dictionary=languages[language]||languages.en||languages;
const t=key=>dictionary[key]??labels[key]??config.cookies?.labels?.[key]??key;
const supabaseConfig=config.supabase||{};
const client=window.supabase?.createClient(supabaseConfig.url,supabaseConfig.publishableKey);

const grid=$("product-grid"),empty=$("empty-message");
const category=$("category-select"),search=$("search-input");
const detail=$("detail-overlay"),cartOverlay=$("cart-overlay");
const detailContent=$("detail-content"),cartContent=$("cart-content");
let activeCategory="ALL",query="",activeProduct=null,quantity=1,variant="";
let cart=[];

const categories=config.categories||["ALL","CD","VINYL","TOPS","OUTERWEAR","PANTS","XTRAS","ALL MERCH"];
category.innerHTML=categories.map(c=>`<option value="${esc(typeof c==="string"?c:c.value)}">${esc(typeof c==="string"?c:c.label)}</option>`).join("");

$("copyright").textContent=config.copyright||"";
$("detail-drawer-title").textContent=config.labels?.productDetails||"";
$("cart-drawer-title").textContent=config.labels?.yourCart||"";

const footerLinks=config.policies?.links||{};
$("footer-links").innerHTML=Object.entries(footerLinks).map(([key,value])=>{
 const item=typeof value==="string"?{url:value,label:key}:value;
 return `<a href="${esc(item.url||item.href||"#")}">${esc(item.label||key)}</a>`;
}).join("")+`<button type="button" id="cookie-choices">${esc(t("cookieChoices"))}</button>`;

function price(p){const n=Number(String(p.price??0).replace(/[^0-9.-]/g,""));return Number.isFinite(n)?n:0}
function money(n,currency="USD"){try{return new Intl.NumberFormat(language,{style:"currency",currency}).format(n)}catch{return String(n)}}
function variants(p){return (p.variants||p.sizes||[]).map(v=>typeof v==="object"?{label:String(v.label||v.name||v.value),value:String(v.value||v.label||v.name)}:{label:String(v),value:String(v)})}
function images(p){return p.images?.length?p.images:[p.image].filter(Boolean)}
function visibleProducts(){return products.filter(p=>{
 const textile=p.material==="TEXTILE";
 const matches=activeCategory==="ALL"||activeCategory==="ALL MERCH"&&textile||activeCategory==="XTRAS"&&p.category==="XTRAS"&&!textile||p.category===activeCategory&&textile;
 return matches&&`${p.name} ${p.type} ${p.category}`.toLowerCase().includes(query.toLowerCase());
})}

function renderProducts(){
 grid.replaceChildren();
 const list=visibleProducts();
 empty.hidden=!!list.length;
 empty.textContent=t(query?"noMatchingProducts":"noProductsAvailable");
 list.forEach(p=>{
  const item=document.createElement("article");
  item.className="product";item.tabIndex=0;item.setAttribute("role","button");
  item.setAttribute("aria-label",p.name);
  item.innerHTML=`<div class="product-image-wrap"><img class="product-image" src="${esc(p.image||"")}" alt="${esc(p.name)}" loading="lazy"></div><div class="product-caption"><div class="product-name">${esc(p.name)}</div><div class="product-price">${esc(p.price)}</div></div>`;
  item.addEventListener("click",()=>openProduct(p));
  item.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openProduct(p)}});
  grid.append(item);
 });
}
function open(overlay){
 overlay.classList.add("is-open");overlay.setAttribute("aria-hidden","false");
 document.body.classList.add("modal-open");
 overlay.querySelector(".drawer-close")?.focus();
}
function close(overlay){
 overlay.classList.remove("is-open");overlay.setAttribute("aria-hidden","true");
 document.body.classList.toggle("modal-open",document.querySelector(".drawer-overlay.is-open")!==null);
}
function openProduct(p){
 activeProduct=p;quantity=1;variant="";
 const imgs=images(p),opts=variants(p);
 detailContent.innerHTML=`
 <div class="detail-layout">
  <div class="detail-gallery"><div class="detail-main-image"><img src="${esc(imgs[0]||"")}" alt="${esc(p.name)}"></div>
  ${imgs.length>1?`<div class="detail-thumbnails">${imgs.map((src,i)=>`<button type="button" data-image="${i}" aria-label="${esc(t("viewImage"))} ${i+1}"><img src="${esc(src)}" alt=""></button>`).join("")}</div>`:""}</div>
  <div class="detail-info"><h3 class="detail-name">${esc(p.name)}</h3><div class="detail-price">${esc(p.price)}</div>
  ${opts.length?`<div class="detail-field"><p class="detail-field-label">${esc(p.variantLabel||t("selectOption"))}</p><div class="detail-variants">${opts.map(v=>`<button type="button" class="variant-button" data-variant="${esc(v.value)}">${esc(v.label)}</button>`).join("")}</div></div>`:""}
  <div class="detail-field"><p class="detail-field-label">${esc(t("quantity"))}</p><div class="detail-quantity"><button type="button" data-qty="-1">−</button><span id="detail-quantity-value">1</span><button type="button" data-qty="1">+</button></div></div>
  <button type="button" class="primary-button full-button" id="detail-add">${esc(t("addToCart"))}</button>
  <p class="detail-description">${esc(p.description||"")}</p><p class="detail-note">${esc(p.type||"")} ${esc(p.material||"")}</p></div></div>`;
 detailContent.querySelectorAll("[data-image]").forEach(b=>b.onclick=()=>{detailContent.querySelector(".detail-main-image img").src=imgs[Number(b.dataset.image)]});
 detailContent.querySelectorAll("[data-variant]").forEach(b=>b.onclick=()=>{
  variant=b.dataset.variant;
  detailContent.querySelectorAll("[data-variant]").forEach(x=>x.classList.toggle("is-selected",x===b));
 });
 detailContent.querySelectorAll("[data-qty]").forEach(b=>b.onclick=()=>{
  quantity=Math.max(1,Math.min(99,quantity+Number(b.dataset.qty)));
  $("detail-quantity-value").textContent=quantity;
 });
 $("detail-add").onclick=()=>{
  if(opts.length&&!variant){let e=detailContent.querySelector(".detail-error");if(!e){e=document.createElement("p");e.className="detail-error";$("detail-add").after(e)}e.textContent=t("selectOption");return}
  const key=p.id+"::"+variant,existing=cart.find(x=>x.key===key);
  if(existing)existing.quantity=Math.min(99,existing.quantity+quantity);
  else cart.push({key,product:p,variant,quantity});
  renderCart();close(detail);open(cartOverlay);
 };
 open(detail);
}
function renderCart(){
 const count=cart.reduce((n,x)=>n+x.quantity,0);
 $("cart-count").textContent=count;
 $("cart-drawer-title").textContent=`${t("yourCart")} (${count})`;
 if(!cart.length){
  cartContent.innerHTML=`<div class="drawer-empty"><h2>${esc(t("cartEmpty"))}</h2><button type="button" class="secondary-button" id="continue-shopping">${esc(t("continueShopping"))}</button></div>`;
  $("continue-shopping").onclick=()=>close(cartOverlay);return;
 }
 const subtotal=cart.reduce((n,x)=>n+price(x.product)*x.quantity,0);
 cartContent.innerHTML=`<div class="cart-items">${cart.map(x=>`<article class="cart-item"><div class="cart-item-image"><img src="${esc(x.product.image||"")}" alt="${esc(x.product.name)}"></div><div class="cart-item-info"><h3 class="cart-item-name">${esc(x.product.name)}</h3>${x.variant?`<div>${esc(x.variant)}</div>`:""}<div class="cart-item-price">${esc(x.product.price)}</div><div class="cart-item-bottom"><div class="cart-quantity"><button type="button" data-change="-1" data-key="${esc(x.key)}">−</button><span>${x.quantity}</span><button type="button" data-change="1" data-key="${esc(x.key)}">+</button></div><button type="button" data-remove="${esc(x.key)}">${esc(t("remove"))}</button></div></div></article>`).join("")}</div><div class="cart-summary"><div class="cart-subtotal"><span>${esc(t("subtotal"))}</span><strong>${esc(money(subtotal))}</strong></div><p class="cart-disclaimer">${esc(t("shippingDisclaimer"))}</p><button type="button" class="primary-button full-button" id="checkout-button">${esc(t("checkout"))}</button><button type="button" class="secondary-button full-button" id="cart-continue">${esc(t("continueShopping"))}</button></div>`;
 cartContent.querySelectorAll("[data-change]").forEach(b=>b.onclick=()=>{const x=cart.find(x=>x.key===b.dataset.key);if(x)x.quantity+=Number(b.dataset.change);cart=cart.filter(x=>x.quantity>0);renderCart()});
 cartContent.querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>{cart=cart.filter(x=>x.key!==b.dataset.remove);renderCart()});
 $("cart-continue").onclick=()=>close(cartOverlay);
 $("checkout-button").onclick=()=>alert(t("checkoutUnavailable"));
}
category.onchange=()=>{activeCategory=category.value;renderProducts()};
search.oninput=()=>{query=search.value.trim();renderProducts()};
$("search-form").onsubmit=e=>e.preventDefault();
$("search-toggle").onclick=()=>{
 const panel=$("search-panel"),isOpen=panel.classList.toggle("is-open");
 $("search-toggle").setAttribute("aria-expanded",String(isOpen));
 if(isOpen)search.focus();else{search.value="";query="";renderProducts()}
};
$("search-close").onclick=()=>{$("search-panel").classList.remove("is-open");$("search-toggle").setAttribute("aria-expanded","false");search.value="";query="";renderProducts()};
$("cart-open").onclick=e=>{e.preventDefault();renderCart();open(cartOverlay)};
$("detail-close").onclick=()=>close(detail);
$("cart-close").onclick=()=>close(cartOverlay);
[detail,cartOverlay].forEach(overlay=>overlay.onclick=e=>{if(e.target===overlay)close(overlay)});
document.addEventListener("keydown",e=>{if(e.key==="Escape")[detail,cartOverlay].forEach(overlay=>close(overlay))});

/* Configured account, policy and cookie interfaces */
const host=$("merch-config-ui");
function modal(id,title,content){
 const el=document.createElement("div");el.className="drawer-overlay";el.id=id;el.setAttribute("aria-hidden","true");
 el.innerHTML=`<section class="drawer" role="dialog" aria-modal="true"><header class="drawer-head"><h2 class="drawer-title">${esc(title)}</h2><button type="button" class="drawer-close" aria-label="${esc(t("close"))}">×</button></header><div class="drawer-content">${content}</div></section>`;
 el.querySelector(".drawer-close").onclick=()=>close(el);el.onclick=e=>{if(e.target===el)close(el)};host.append(el);return el;
}
const account=config.account||{};
const accountLabels=account.labels||{};
const accountPanel=modal("account-overlay",accountLabels.title||t("signIn"),`
 <div id="account-status" role="status"></div><form id="account-form"><p>${esc(accountLabels.subtitle||"")}</p><input id="account-email" type="email" required autocomplete="email" placeholder="${esc(accountLabels.emailPlaceholder||"")}" aria-label="${esc(accountLabels.emailPlaceholder||"Email")}"><label><input id="account-updates" type="checkbox"> ${esc(accountLabels.updatesOptIn||"")}</label><p>${esc(accountLabels.termsPrefix||"")} <a href="${esc(config.policies?.links?.terms||"#")}">${esc(accountLabels.termsLink||"")}</a> <a href="${esc(config.policies?.links?.privacy||"#")}">${esc(accountLabels.privacyLink||"")}</a></p><button class="primary-button account-submit" type="submit">${esc(accountLabels.continue||t("continue"))}</button></form>
 <form id="otp-form" hidden><p>${esc(accountLabels.otpDescription||"")}</p><div class="otp-fields">${Array.from({length:account.otpLength||6},(_,i)=>`<input class="otp-input" inputmode="numeric" maxlength="1" aria-label="${esc(t("verificationDigit"))} ${i+1}">`).join("")}</div><p id="otp-status" role="status"></p><button class="primary-button" id="otp-verify" type="submit">${esc(accountLabels.verifyCode||t("verify"))}</button><button type="button" id="otp-resend">${esc(accountLabels.resendCode||t("resendCode"))}</button><button type="button" id="otp-back">${esc(accountLabels.changeEmail||t("changeEmail"))}</button></form>
 <div id="account-profile" hidden><p id="profile-email"></p><button type="button" id="sign-out">${esc(accountLabels.signOut||t("signOut"))}</button></div>`);
const $in=(root,id)=>root.querySelector("#"+id);
$("profile-open").onclick=()=>{open(accountPanel);$in(accountPanel,"account-email").focus()};
const accountForm=$in(accountPanel,"account-form"),otpForm=$in(accountPanel,"otp-form");
let pendingEmail="";
accountForm.onsubmit=async e=>{
 e.preventDefault();if(!client)return;
 const email=$in(accountPanel,"account-email").value.trim(),button=accountForm.querySelector("button[type=submit]");
 button.disabled=true;
 try{
  const {error}=await client.auth.signInWithOtp({email,options:{shouldCreateUser:true,data:{marketing_updates:$in(accountPanel,"account-updates").checked}}});
  if(error)throw error;pendingEmail=email;accountForm.hidden=true;otpForm.hidden=false;
  $in(accountPanel,"otp-status").textContent="";
  accountPanel.querySelector(".otp-input").focus();
 }catch(err){$in(accountPanel,"account-status").textContent=t("otpSendError");console.error(err)}
 finally{button.disabled=false}
};
const otpInputs=[...accountPanel.querySelectorAll(".otp-input")];
otpInputs.forEach((input,i)=>{
 input.oninput=()=>{input.value=input.value.replace(/\D/g,"").slice(-1);if(input.value&&otpInputs[i+1])otpInputs[i+1].focus();if(otpInputs.every(x=>x.value))otpForm.requestSubmit()};
 input.onkeydown=e=>{if(e.key==="Backspace"&&!input.value&&otpInputs[i-1])otpInputs[i-1].focus()};
});
otpForm.onsubmit=async e=>{
 e.preventDefault();if(!client)return;
 const token=otpInputs.map(x=>x.value).join("");
 if(token.length!==(account.otpLength||6))return;
 const button=$in(accountPanel,"otp-verify");button.disabled=true;
 try{
  const {data,error}=await client.auth.verifyOtp({email:pendingEmail,token,type:account.otpType||"email"});
  if(error)throw error;otpForm.hidden=true;$in(accountPanel,"account-profile").hidden=false;
  $in(accountPanel,"profile-email").textContent=data.user?.email||pendingEmail;
 }catch(err){$in(accountPanel,"otp-status").textContent=t("otpVerifyError");console.error(err)}
 finally{button.disabled=false}
};
$in(accountPanel,"otp-back").onclick=()=>{otpForm.hidden=true;accountForm.hidden=false;$in(accountPanel,"account-email").value=pendingEmail};
$in(accountPanel,"otp-resend").onclick=()=>accountForm.requestSubmit();
$in(accountPanel,"sign-out").onclick=async()=>{if(!client)return;const {error}=await client.auth.signOut();if(error)return;$in(accountPanel,"account-profile").hidden=true;accountForm.hidden=false;close(accountPanel)};
if(client)client.auth.onAuthStateChange((event,session)=>{
 if(session?.user){$in(accountPanel,"account-profile").hidden=false;$in(accountPanel,"profile-email").textContent=session.user.email||"";accountForm.hidden=true;otpForm.hidden=true}
 else if(event==="SIGNED_OUT"){$in(accountPanel,"account-profile").hidden=true;accountForm.hidden=false;otpForm.hidden=true}
});

const policyConfig=config.policies||{};
for(const [key,policy] of Object.entries(policyConfig)){
 if(!policy||typeof policy!=="object"||!policy.title||!Array.isArray(policy.sections))continue;
 const sectionHTML=policy.sections.map(s=>`<section><h3>${esc(s.title||"")}</h3><p>${esc(s.content||s.text||"")}</p></section>`).join("");
 const panel=modal(`${key}-overlay`,policy.title,`<div class="policy-content">${sectionHTML}</div>`);
 document.querySelectorAll(`[data-policy-open="${key}"]`).forEach(b=>b.onclick=()=>open(panel));
 const footerLink=Object.entries(footerLinks).find(([name,value])=>name.toLowerCase().includes(key));
 if(footerLink){const link=[...$("footer-links").querySelectorAll("a")].find(a=>a.href.includes(key));if(link)link.onclick=e=>{e.preventDefault();open(panel)}}
}

const cookieConfig=config.cookies||{},cookieLabels=cookieConfig.labels||{};
const savedDefaults=cookieConfig.defaultPreferences||{};
const cookiePanel=modal("cookie-panel",cookieLabels.collectHeading||t("cookieChoices"),`
 <p>${esc(cookieLabels.collectText||"")}</p><a href="${esc(config.policies?.links?.privacy||"#")}">${esc(cookieLabels.privacyLink||"")}</a>
 <h3>${esc(cookieLabels.partnersHeading||"")}</h3><p>${esc(cookieLabels.partnersText||"")}</p>
 ${["essential","functional","analytics","advertising"].map(k=>`<label><input type="checkbox" id="cookie-${k}" ${k==="essential"||savedDefaults[k]?"checked":""} ${k==="essential"?"disabled":""}> ${esc(cookieLabels[k]||k)}</label>`).join("")}
 <label>${esc(cookieLabels.languageLabel||t("language"))}<select id="cookie-language-select">${Object.entries(cookieConfig.languages||{en:"English",tr:"Türkçe"}).map(([k,v])=>`<option value="${esc(k)}">${esc(typeof v==="string"?v:v.label)}</option>`).join("")}</select></label>
 <button type="button" class="primary-button" id="cookie-confirm">${esc(cookieLabels.confirm||t("confirm"))}</button>`);
$("cookie-choices").onclick=()=>open(cookiePanel);
$in(cookiePanel,"cookie-confirm").onclick=()=>{
 const prefs={essential:true};
 ["functional","analytics","advertising"].forEach(k=>prefs[k]=$in(cookiePanel,"cookie-"+k).checked);
 try{localStorage.setItem("vn-cookie-preferences",JSON.stringify({...prefs,updatedAt:new Date().toISOString()}))}catch{}
 close(cookiePanel);
};
$in(cookiePanel,"cookie-language-select").onchange=e=>{
 const lang=e.target.value;document.documentElement.lang=lang;
 const d=languages[lang]||{};
 document.querySelectorAll("[data-i18n]").forEach(el=>{if(d[el.dataset.i18n])el.textContent=d[el.dataset.i18n]});
};

/* Initialize */
renderProducts();renderCart();
try{
 const saved=JSON.parse(localStorage.getItem("vn-cookie-preferences")||"null");
 if(saved)["functional","analytics","advertising"].forEach(k=>{if($in(cookiePanel,"cookie-"+k))$in(cookiePanel,"cookie-"+k).checked=Boolean(saved[k])});
}catch{}
})().catch(error=>{
 console.error("VN SHOP configuration failed:",error);
 const empty=document.getElementById("empty-message");
 if(empty){empty.hidden=false;empty.textContent="SHOP CONFIGURATION COULD NOT BE LOADED"}
});
</script>
</body>
</html>
